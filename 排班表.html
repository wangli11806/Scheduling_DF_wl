<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>客服排班系统</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
        body {
            background: #f1f5f9; margin: 0; padding: 0;
            display: flex; min-height: 100vh;
            font-size: 13px; color: #1e293b;
        }

        /* ===== 左侧菜单栏 ===== */
        .sidebar {
            width: 190px; min-width: 190px; background: #1e293b; color: #e2e8f0;
            display: flex; flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.08);
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
        }
        .sidebar-logo {
            padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 1.15rem; font-weight: 700; color: white; letter-spacing: 0.5px;
        }
        .sidebar-nav { padding: 8px 0; flex: 1; }
        .sidebar-nav .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 13px 18px; margin: 3px 10px; border-radius: 10px;
            font-size: 1rem; cursor: pointer; transition: all 0.15s;
            color: #cbd5e1; text-decoration: none; user-select: none;
        }
        .sidebar-nav .nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
        .sidebar-nav .nav-item.active {
            background: rgba(99, 102, 241, 0.25); color: #a5b4fc; font-weight: 600;
        }

        /* ===== 主内容区 ===== */
        .main-area {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
        }
        .header-bar {
            background: white; padding: 14px 28px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border-bottom: 1px solid #e8ecf1;
        }
        .header-bar h1 {
            font-size: 1.15rem; font-weight: 700; color: #1e293b; margin: 0; white-space: nowrap;
        }
        .header-right {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        }
        .view-toggle { display: flex; background: #eef2ff; border-radius: 60px; padding: 3px; gap: 2px; }
        .view-btn {
            border: none; background: transparent; padding: 7px 20px; border-radius: 40px;
            font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 0.92rem;
        }
        .view-btn.active { background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #1f3a64; }
        .date-nav { display: flex; align-items: center; gap: 8px; background: #f8fafc; padding: 4px 12px; border-radius: 60px; }
        .date-nav button {
            background: none; border: none; font-size: 1.1rem; cursor: pointer;
            width: 28px; height: 28px; border-radius: 30px; display: inline-flex;
            align-items: center; justify-content: center; color: #475569;
        }
        .date-nav button:hover { background: #e2e8f0; }
        .week-range {
            font-weight: 600; background: white; padding: 4px 12px; border-radius: 40px;
            font-size: 0.92rem; min-width: 180px; text-align: center;
        }

        .content-body { flex: 1; padding: 20px 28px; overflow-x: hidden; }

        /* 筛选区域 */
        .filter-area {
            background: white; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px;
            display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03); border: 1px solid #e8ecf1;
        }
        .filter-field { display: flex; flex-direction: column; gap: 5px; width: 360px; }
        .filter-field label { font-size: 0.92rem; font-weight: 600; color: #64748b; }
        .filter-buttons { display: flex; gap: 10px; align-items: flex-end; margin-left: auto; }
        .filter-buttons .btn { min-width: 100px; justify-content: center; }

        /* 多选下拉 */
        .multi-select { position: relative; user-select: none; }
        .multi-select-trigger {
            display: flex; align-items: center; flex-wrap: wrap; gap: 3px;
            min-height: 34px; padding: 3px 8px; border: 1px solid #cbd5e1;
            border-radius: 10px; background: white; cursor: pointer; font-size: 0.92rem;
            transition: border-color 0.15s;
        }
        .multi-select-trigger:hover { border-color: #94a3b8; }
        .multi-select.open .multi-select-trigger { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.12); }
        .ms-tag {
            display: inline-flex; align-items: center; gap: 2px;
            background: #eef2ff; color: #3730a3; padding: 2px 7px; border-radius: 6px;
            font-size: 0.85rem; font-weight: 500;
        }
        .ms-tag .ms-tag-x { cursor: pointer; font-size: 0.85rem; opacity: 0.6; }
        .ms-tag .ms-tag-x:hover { opacity: 1; }
        .ms-placeholder { color: #94a3b8; font-size: 0.92rem; }
        .ms-dropdown {
            display: none; position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 100; max-height: 280px;
            overflow: hidden;
        }
        .multi-select.open .ms-dropdown { display: block; }
        .ms-search { padding: 6px 10px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 6px; align-items: center; }
        .ms-search input {
            flex: 1; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px;
            font-size: 0.92rem; outline: none;
        }
        .ms-search input:focus { border-color: #6366f1; }
        .ms-select-all {
            font-size: 0.85rem; color: #6366f1; cursor: pointer; white-space: nowrap;
            padding: 5px 10px; border-radius: 6px; font-weight: 600;
            border: 1px solid #c7d2fe; background: #eef2ff;
        }
        .ms-select-all:hover { background: #e0e7ff; }
        .ms-options { max-height: 180px; overflow-y: auto; padding: 4px 0; }
        .ms-option {
            display: flex; align-items: center; gap: 8px; padding: 7px 12px;
            font-size: 0.92rem; cursor: pointer; transition: background 0.1s;
        }
        .ms-option:hover { background: #f8fafc; }
        .ms-option input[type="checkbox"] { accent-color: #6366f1; }
        .ms-actions {
            display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid #e2e8f0;
            justify-content: flex-end;
        }

        /* 按钮 */
        .btn {
            background: white; border: 1px solid #cbd5e1; padding: 7px 18px;
            border-radius: 40px; font-weight: 500; font-size: 0.92rem; cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
            color: #1e293b; white-space: nowrap;
        }
        .btn:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-primary { background: #2c3e66; border-color: #2c3e66; color: white; }
        .btn-primary:hover { background: #1e2f4a; }
        .btn-warning { background: #f59e0b; border-color: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-success { background: #10b981; border-color: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-sm { padding: 5px 12px; font-size: 0.85rem; }

        /* 操作栏 */
        .action-bar {
            display: flex; gap: 12px; margin-bottom: 16px; align-items: center;
        }

        /* 排班表格 */
        .schedule-table-wrapper {
            overflow-x: auto; border-radius: 16px; background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid #edf2f7;
        }
        .schedule-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 700px; }
        .schedule-table th {
            background: #f9fbfd; padding: 12px 6px; border-bottom: 1px solid #e2e8f0;
            font-weight: 700; color: #2c3e66; text-align: center; font-size: 0.92rem;
        }
        .schedule-table td {
            border: 1px solid #ecf3fa; padding: 12px 6px; text-align: center;
            vertical-align: middle; background-color: white;
        }
        .weekday-row th {
            font-weight: 500; font-size: 0.85rem; color: #64748b;
            padding: 6px 6px; background: #fafafa;
        }

        /* 冻结左侧两列 */
        .schedule-table th:nth-child(1),
        .schedule-table td:nth-child(1) {
            position: sticky; left: 0; z-index: 2;
        }
        .schedule-table th:nth-child(2),
        .schedule-table td:nth-child(2) {
            position: sticky; left: 90px; z-index: 2;
        }
        .schedule-table thead th:nth-child(1),
        .schedule-table thead th:nth-child(2) {
            z-index: 3;
        }

        .shift-tag {
            display: inline-block; padding: 5px 14px; border-radius: 40px;
            font-size: 0.92rem; font-weight: 600; min-width: 50px;
        }
        .shift-tag.shift-work { background: #c8e6c9; color: #2e7d32; }
        .shift-tag.shift-rest { background: #eeeeee; color: #616161; }
        .shift-tag.shift-leave { background: #ffe0b2; color: #e65100; }
        .shift-tag.shift-none { background: #f5f5f5; color: #bdbdbd; }

        .emp-info { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .emp-name { font-weight: 600; font-size: 0.92rem; color: #1e293b; }
        .emp-team { font-weight: 600; font-size: 0.92rem; color: #1e293b; }

        /* 弹窗 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.45); z-index: 900;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-dialog {
            background: white; border-radius: 24px; padding: 32px; width: 520px; max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-title { font-size: 1.15rem; font-weight: 600; color: #1e293b; margin-bottom: 24px; }
        .modal-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .modal-row label { font-size: 0.92rem; font-weight: 500; color: #475569; }
        .modal-row select, .modal-row input[type="date"] {
            padding: 10px 14px; border-radius: 16px; border: 1px solid #cbd5e1;
            background: white; font-size: 0.92rem; width: 100%;
        }
        .date-range-group {
            display: flex; align-items: center; gap: 0;
            border: 1px solid #cbd5e1; border-radius: 16px; overflow: hidden;
            transition: border-color 0.15s;
        }
        .date-range-group:focus-within { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.12); }
        .date-range-group input {
            border: none !important; border-radius: 0 !important; padding: 10px 12px;
            font-size: 0.92rem; outline: none; flex: 1; min-width: 0;
        }
        .date-range-group .dr-sep {
            padding: 0 4px; color: #94a3b8; font-size: 0.92rem;
            background: #f8fafc; line-height: 38px; user-select: none;
        }
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .radio-option { position: relative; }
        .radio-option input { position: absolute; opacity: 0; width: 0; height: 0; }
        .radio-option label {
            display: inline-block; padding: 8px 18px; border-radius: 40px;
            border: 1.5px solid #cbd5e1; font-size: 0.92rem; cursor: pointer;
            transition: all 0.15s; font-weight: 500; color: #475569;
        }
        .radio-option input:checked + label {
            border-color: #2c3e66; background: #eef2ff; color: #1e3a5f; font-weight: 600;
        }
        .radio-option input:checked + label.work { border-color: #2e7d32; background: #c8e6c9; color: #2e7d32; }
        .radio-option input:checked + label.rest { border-color: #757575; background: #eeeeee; color: #424242; }
        .radio-option input:checked + label.leave { border-color: #e65100; background: #ffe0b2; color: #e65100; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }

        .toast-msg {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 10px 24px; border-radius: 60px;
            font-size: 0.92rem; z-index: 1000; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.2s; pointer-events: none;
        }

        @media (max-width: 860px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%; min-width: auto; height: auto; position: relative;
                flex-direction: row; flex-wrap: wrap; padding: 10px 14px; gap: 6px; align-items: center;
            }
            .sidebar-logo { padding: 0; border-bottom: none; }
            .sidebar-nav { display: flex; padding: 0; gap: 4px; }
            .sidebar-nav .nav-item { margin: 0; padding: 8px 12px; }
            .header-bar { flex-direction: column; align-items: flex-start; }
            .header-right { width: 100%; justify-content: space-between; }
            .content-body { padding: 14px 12px; }
            .filter-field { width: 100%; }
            .filter-buttons { margin-left: 0; }
            .modal-dialog { width: 96vw; padding: 24px; }
        }
    </style>
</head>
<body>

<!-- 左侧菜单栏 -->
<aside class="sidebar">
    <div class="sidebar-logo">客服排班系统</div>
    <nav class="sidebar-nav">
        <a class="nav-item active" data-page="schedule" href="排班表.html">排班表</a>
        <a class="nav-item" data-page="employees" href="员工管理.html">员工管理</a>
        <a class="nav-item" data-page="shifts" href="班次设置.html">班次设置</a>
        <a class="nav-item" data-page="stats">排班统计</a>
    </nav>
</aside>

<!-- 主内容区 -->
<div class="main-area">

    <div class="header-bar">
        <h1>排班表</h1>
        <div class="header-right">
            <div class="view-toggle">
                <button class="view-btn active" data-view="week">周视图</button>
                <button class="view-btn" data-view="month">月视图</button>
            </div>
            <div class="date-nav">
                <button id="prevPeriodBtn">◀</button>
                <div class="week-range" id="dateRangeLabel">加载中...</div>
                <button id="nextPeriodBtn">▶</button>
            </div>
        </div>
    </div>

    <div class="content-body">

        <!-- 筛选区域 -->
        <div class="filter-area">
            <div class="filter-field">
                <label>员工姓名</label>
                <div class="multi-select" id="filterEmployee">
                    <div class="multi-select-trigger" id="filterEmployeeTrigger">
                        <span class="ms-placeholder">全部员工</span>
                    </div>
                    <div class="ms-dropdown">
                        <div class="ms-search">
                            <input type="text" placeholder="搜索..." id="filterEmployeeSearch">
                            <span class="ms-select-all" id="filterEmployeeAll">全选</span>
                        </div>
                        <div class="ms-options" id="filterEmployeeOptions"></div>
                        <div class="ms-actions">
                            <button class="btn btn-sm" id="filterEmployeeClear">清除</button>
                            <button class="btn btn-sm btn-primary" id="filterEmployeeOk">确定</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="filter-field">
                <label>所属团队</label>
                <div class="multi-select" id="filterTeam">
                    <div class="multi-select-trigger" id="filterTeamTrigger">
                        <span class="ms-placeholder">全部团队</span>
                    </div>
                    <div class="ms-dropdown">
                        <div class="ms-search">
                            <input type="text" placeholder="搜索..." id="filterTeamSearch">
                            <span class="ms-select-all" id="filterTeamAll">全选</span>
                        </div>
                        <div class="ms-options" id="filterTeamOptions"></div>
                        <div class="ms-actions">
                            <button class="btn btn-sm" id="filterTeamClear">清除</button>
                            <button class="btn btn-sm btn-primary" id="filterTeamOk">确定</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="filter-buttons">
                <button class="btn" id="resetFilterBtn">重置选项</button>
                <button class="btn btn-primary" id="queryBtn">查询</button>
                <button class="btn btn-success" id="exportExcelBtn">导出</button>
            </div>
        </div>

        <!-- 操作按钮栏 -->
        <div class="action-bar">
            <button class="btn btn-success" id="addScheduleBtn">新增排班</button>
            <button class="btn btn-warning" id="editScheduleBtn">修改排班</button>
        </div>

        <input type="file" id="uploadExcelInput" accept=".xls" style="display:none;">

        <!-- 视图容器 -->
        <div id="scheduleViewContainer" class="schedule-table-wrapper"></div>
    </div>
</div>

<!-- 新增排班弹窗 -->
<div class="modal-overlay" id="addModal">
    <div class="modal-dialog" style="text-align:center;">
        <div class="modal-title" style="text-align:left;">新增排班</div>
        <p style="font-size:0.92rem; color:#64748b; margin-bottom:20px;">仅支持 <strong>.xls</strong> 格式上传</p>
        <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:20px;">
            请确保 Excel 包含列：<strong>日期、员工、班次</strong>
        </p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <button class="btn btn-outline" id="downloadTemplateBtn">下载模板</button>
            <button class="btn btn-primary" id="selectFileBtn">选择文件上传</button>
        </div>
    </div>
</div>

<!-- 修改排班弹窗 -->
<div class="modal-overlay" id="editModal">
    <div class="modal-dialog">
        <div class="modal-title">修改排班</div>
        <div class="modal-row">
            <label>选择团队（可多选）</label>
            <div class="multi-select" id="modalTeam">
                <div class="multi-select-trigger" id="modalTeamTrigger">
                    <span class="ms-placeholder">请选择团队</span>
                </div>
                <div class="ms-dropdown">
                    <div class="ms-search">
                        <input type="text" placeholder="搜索..." id="modalTeamSearch">
                        <span class="ms-select-all" id="modalTeamAll">全选</span>
                    </div>
                    <div class="ms-options" id="modalTeamOptions"></div>
                    <div class="ms-actions">
                        <button class="btn btn-sm" id="modalTeamClear">清除</button>
                        <button class="btn btn-sm btn-primary" id="modalTeamOk">确定</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-row">
            <label>选择员工（可多选，基于所选团队）</label>
            <div class="multi-select" id="modalEmployee">
                <div class="multi-select-trigger" id="modalEmployeeTrigger">
                    <span class="ms-placeholder">请先选择团队</span>
                </div>
                <div class="ms-dropdown">
                    <div class="ms-search">
                        <input type="text" placeholder="搜索..." id="modalEmployeeSearch">
                        <span class="ms-select-all" id="modalEmployeeAll">全选</span>
                    </div>
                    <div class="ms-options" id="modalEmployeeOptions"></div>
                    <div class="ms-actions">
                        <button class="btn btn-sm" id="modalEmployeeClear">清除</button>
                        <button class="btn btn-sm btn-primary" id="modalEmployeeOk">确定</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-row">
            <label>选择日期区间</label>
            <div class="date-range-group">
                <input type="date" id="modalStartDate">
                <span class="dr-sep">至</span>
                <input type="date" id="modalEndDate">
            </div>
        </div>
        <div class="modal-row">
            <label>选择班次</label>
            <div class="radio-group" id="modalShiftRadios"></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="modalCancelBtn">取消</button>
            <button class="btn btn-primary" id="modalSaveBtn">保存</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg" style="display: none;"></div>

<script>
    // ========== 数据层 ==========
    let scheduleMap = new Map();
    function getTeamOptions() {
        const teams = [...new Set(employees.map(e => e.team))];
        return teams.length > 0 ? teams.sort() : ["综合组"];
    }
    const SHIFT_STORAGE_KEY = 'schedule_shifts';
    const weekDayNames = ["日", "一", "二", "三", "四", "五", "六"];

    function loadShiftOptions() {
        const stored = localStorage.getItem(SHIFT_STORAGE_KEY);
        if(stored) {
            const data = JSON.parse(stored);
            return [...data.map(s => s.name), "休息", "请假"];
        }
        return ["A班", "B班", "C班", "休息", "请假"];
    }

    function loadWorkShifts() {
        const stored = localStorage.getItem(SHIFT_STORAGE_KEY);
        if(stored) {
            return JSON.parse(stored).map(s => s.name);
        }
        return ["A班", "B班", "C班"];
    }

    let shiftOptions = loadShiftOptions();
    let workShifts = loadWorkShifts();

    const STORAGE_KEY = 'schedule_employees';

    function loadEmployeesFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            const data = JSON.parse(stored);
            return data.map(e => ({ name: e.name, team: e.team }));
        }
        const defaults = [
            {name: "张三", team: "在线组"},
            {name: "李四", team: "热线组"},
            {name: "王芳", team: "售后组"},
            {name: "赵磊", team: "在线组"},
            {name: "陈敏", team: "主管"}
        ];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults.map((e, i) => ({
            id: `EMP${String(i + 1).padStart(3, '0')}`, name: e.name, team: e.team,
            position: e.team === '主管' ? '主管' : '客服', supervisor: e.team === '主管' ? '' : '陈敏',
            entryDate: '2024-01-01'
        }))));
        return defaults;
    }

    let employees = loadEmployeesFromStorage();

    let filterSelectedEmployees = getEmployeeNames();
    let filterSelectedTeams = [...getTeamOptions()];
    let modalSelectedTeams = [];
    let modalSelectedEmployees = [];

    function getEmployeeNames() { return employees.map(e => e.name); }
    function getEmployeesByTeams(teams) {
        if(teams.length === 0) return [];
        return employees.filter(e => teams.includes(e.team)).map(e => e.name);
    }

    function getShiftClass(shift) {
        if (workShifts.includes(shift)) return "shift-work";
        if (shift === "休息") return "shift-rest";
        if (shift === "请假") return "shift-leave";
        return "shift-none";
    }

    function formatDate(date) { return date.toISOString().slice(0,10); }
    function parseDate(str) { return new Date(str + "T00:00:00"); }

    function getFilteredEmployees() {
        return employees.filter(e =>
            filterSelectedEmployees.includes(e.name) && filterSelectedTeams.includes(e.team)
        );
    }

    function initDemoData() {
        scheduleMap.clear();
        const startDemo = new Date(2025, 4, 19);
        const endDemo = new Date(2025, 5, 15);
        let cur = new Date(startDemo);
        const names = getEmployeeNames();
        while(cur <= endDemo) {
            const dateStr = formatDate(cur);
            names.forEach(emp => {
                const rand = Math.floor(Math.random() * shiftOptions.length);
                scheduleMap.set(`${dateStr}|${emp}`, shiftOptions[rand]);
            });
            cur.setDate(cur.getDate() + 1);
        }
        scheduleMap.set("2025-05-20|张三","A班");
        scheduleMap.set("2025-05-21|李四","休息");
        scheduleMap.set("2025-05-22|王芳","C班");
    }

    function getShift(date, emp) {
        return scheduleMap.get(`${date}|${emp}`) || "未排班";
    }

    function setShift(date, emp, shift) {
        if(!shift || shift === "未排班") shift = "休息";
        scheduleMap.set(`${date}|${emp}`, shift);
    }

    function exportToExcel() {
        let dataRows = [["日期", "员工", "所属团队", "班次"]];
        let dateSet = new Set();
        for(let key of scheduleMap.keys()) dateSet.add(key.split('|')[0]);
        let sortedDates = Array.from(dateSet).sort();
        const filtered = getFilteredEmployees();
        for(let date of sortedDates) {
            for(let emp of filtered) {
                let shift = getShift(date, emp.name);
                dataRows.push([date, emp.name, emp.team, shift]);
            }
        }
        const ws = XLSX.utils.aoa_to_sheet(dataRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "排班表");
        XLSX.writeFile(wb, `排班数据_${formatDate(new Date())}.xlsx`);
        showToast("导出完成");
    }

    function downloadTemplate() {
        const rows = [["日期", "员工", "班次"], ["2025-06-01", "张三", "A班"]];
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "排班模板");
        XLSX.writeFile(wb, "排班导入模板.xls");
        showToast("模板已下载");
    }

    function importExcel(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1, defval: ""});
            if(!rows || rows.length < 2) { showToast("Excel至少包含两行数据"); return; }
            let header = rows[0];
            let dateIdx = -1, empIdx = -1, shiftIdx = -1;
            for(let i=0; i<header.length; i++) {
                let cell = String(header[i]).toLowerCase();
                if(cell.includes("日期")) dateIdx = i;
                else if(cell.includes("员工") || cell.includes("姓名")) empIdx = i;
                else if(cell.includes("班次") || cell.includes("shift")) shiftIdx = i;
            }
            if(dateIdx === -1 || empIdx === -1 || shiftIdx === -1) {
                showToast("Excel需包含【日期,员工,班次】三列"); return;
            }
            let updated = 0;
            const names = getEmployeeNames();
            for(let i=1; i<rows.length; i++) {
                let row = rows[i];
                if(!row || row.length < Math.max(dateIdx, empIdx, shiftIdx)+1) continue;
                let rawDate = row[dateIdx];
                let employee = row[empIdx] ? String(row[empIdx]).trim() : "";
                let shift = row[shiftIdx] ? String(row[shiftIdx]).trim() : "";
                if(!rawDate || !employee || !shift) continue;
                let dateObj = new Date(rawDate);
                if(isNaN(dateObj.getTime())) {
                    let parts = String(rawDate).split('-');
                    if(parts.length===3) dateObj = new Date(parts[0], parts[1]-1, parts[2]);
                    if(isNaN(dateObj.getTime())) continue;
                }
                const dateStr = formatDate(dateObj);
                if(!names.includes(employee)) {
                    employees.push({name: employee, team: "综合组"});
                    names.push(employee);
                    rebuildAllPageFilters();
                }
                setShift(dateStr, employee, shift);
                updated++;
            }
            showToast(`成功导入并更新 ${updated} 条排班记录`);
            renderCurrentView();
        };
        reader.readAsArrayBuffer(file);
    }

    // ========== 多选下拉组件 ==========
    function initMultiSelect(config) {
        const { containerId, triggerId, searchId, selectAllId, optionsId, clearId, okId, getOptions, getSelected, setSelected, placeholder } = config;
        const container = document.getElementById(containerId);
        const trigger = document.getElementById(triggerId);
        const searchInput = document.getElementById(searchId);
        const selectAllBtn = document.getElementById(selectAllId);
        const optionsContainer = document.getElementById(optionsId);

        function renderTrigger() {
            const sel = getSelected();
            const allOpts = getOptions();
            if(sel.length === 0) {
                trigger.innerHTML = `<span class="ms-placeholder">${placeholder || '请选择'}</span>`;
            } else if(sel.length === allOpts.length && allOpts.length > 0) {
                trigger.innerHTML = `<span class="ms-placeholder" style="color:#3730a3;font-weight:500;">全部 (${allOpts.length})</span>`;
            } else {
                trigger.innerHTML = sel.map(v => `<span class="ms-tag">${v}<span class="ms-tag-x" data-val="${v}">×</span></span>`).join('');
                trigger.querySelectorAll('.ms-tag-x').forEach(x => {
                    x.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        const val = x.getAttribute('data-val');
                        setSelected(getSelected().filter(v => v !== val));
                        renderDropdown();
                        renderTrigger();
                        if(config.onChange) config.onChange();
                    });
                });
            }
        }

        function renderDropdown() {
            const sel = getSelected();
            const q = searchInput.value.toLowerCase();
            const allOpts = getOptions();
            const opts = allOpts.filter(o => o.toLowerCase().includes(q));
            if(sel.length === allOpts.length && allOpts.length > 0) {
                selectAllBtn.textContent = '取消全选';
            } else {
                selectAllBtn.textContent = '全选';
            }
            optionsContainer.innerHTML = opts.map(o => {
                const checked = sel.includes(o) ? 'checked' : '';
                return `<label class="ms-option"><input type="checkbox" value="${o}" ${checked}> ${o}</label>`;
            }).join('');
            if(opts.length === 0) {
                optionsContainer.innerHTML = `<div style="padding:16px;text-align:center;color:#94a3b8;">无匹配选项</div>`;
            }
            optionsContainer.querySelectorAll('input').forEach(cb => {
                cb.addEventListener('change', () => {
                    if(cb.checked) setSelected([...getSelected(), cb.value]);
                    else setSelected(getSelected().filter(v => v !== cb.value));
                    renderTrigger();
                    if(config.onChange) config.onChange();
                });
            });
        }

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = container.classList.contains('open');
            document.querySelectorAll('.multi-select.open').forEach(ms => ms.classList.remove('open'));
            if(!isOpen) {
                container.classList.add('open');
                searchInput.value = '';
                renderDropdown();
                setTimeout(() => searchInput.focus(), 50);
            }
        });

        searchInput.addEventListener('input', renderDropdown);
        searchInput.addEventListener('click', e => e.stopPropagation());

        selectAllBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const allOpts = getOptions();
            if(getSelected().length === allOpts.length && allOpts.length > 0) {
                setSelected([]);
            } else {
                setSelected([...allOpts]);
            }
            renderTrigger();
            renderDropdown();
            if(config.onChange) config.onChange();
        });

        document.getElementById(clearId).addEventListener('click', () => {
            setSelected([]);
            renderTrigger();
            renderDropdown();
            if(config.onChange) config.onChange();
        });

        document.getElementById(okId).addEventListener('click', () => {
            container.classList.remove('open');
        });

        document.addEventListener('click', () => {
            container.classList.remove('open');
        });

        renderTrigger();
        return { renderTrigger, renderDropdown };
    }

    let msPageEmployee, msPageTeam;
    let msModalTeam, msModalEmployee;

    function initAllMultiSelects() {
        msPageEmployee = initMultiSelect({
            containerId: 'filterEmployee', triggerId: 'filterEmployeeTrigger',
            searchId: 'filterEmployeeSearch', selectAllId: 'filterEmployeeAll',
            optionsId: 'filterEmployeeOptions', clearId: 'filterEmployeeClear',
            okId: 'filterEmployeeOk', placeholder: '全部员工',
            getOptions: () => getEmployeeNames(),
            getSelected: () => filterSelectedEmployees,
            setSelected: (v) => { filterSelectedEmployees = v; }
        });

        msPageTeam = initMultiSelect({
            containerId: 'filterTeam', triggerId: 'filterTeamTrigger',
            searchId: 'filterTeamSearch', selectAllId: 'filterTeamAll',
            optionsId: 'filterTeamOptions', clearId: 'filterTeamClear',
            okId: 'filterTeamOk', placeholder: '全部团队',
            getOptions: () => getTeamOptions(),
            getSelected: () => filterSelectedTeams,
            setSelected: (v) => { filterSelectedTeams = v; }
        });

        msModalTeam = initMultiSelect({
            containerId: 'modalTeam', triggerId: 'modalTeamTrigger',
            searchId: 'modalTeamSearch', selectAllId: 'modalTeamAll',
            optionsId: 'modalTeamOptions', clearId: 'modalTeamClear',
            okId: 'modalTeamOk', placeholder: '请选择团队',
            getOptions: () => getTeamOptions(),
            getSelected: () => modalSelectedTeams,
            setSelected: (v) => {
                modalSelectedTeams = v;
                const validEmps = getEmployeesByTeams(modalSelectedTeams);
                modalSelectedEmployees = modalSelectedEmployees.filter(e => validEmps.includes(e));
                msModalEmployee.renderTrigger();
                msModalEmployee.renderDropdown();
            },
            onChange: () => {
                const validEmps = getEmployeesByTeams(modalSelectedTeams);
                modalSelectedEmployees = modalSelectedEmployees.filter(e => validEmps.includes(e));
                msModalEmployee.renderTrigger();
                msModalEmployee.renderDropdown();
            }
        });

        msModalEmployee = initMultiSelect({
            containerId: 'modalEmployee', triggerId: 'modalEmployeeTrigger',
            searchId: 'modalEmployeeSearch', selectAllId: 'modalEmployeeAll',
            optionsId: 'modalEmployeeOptions', clearId: 'modalEmployeeClear',
            okId: 'modalEmployeeOk', placeholder: '请先选择团队',
            getOptions: () => getEmployeesByTeams(modalSelectedTeams),
            getSelected: () => modalSelectedEmployees,
            setSelected: (v) => { modalSelectedEmployees = v; }
        });
    }

    function rebuildAllPageFilters() {
        msPageEmployee.renderDropdown();
        msPageEmployee.renderTrigger();
        msPageTeam.renderDropdown();
        msPageTeam.renderTrigger();
    }

    function resetModalSelections() {
        modalSelectedTeams = [];
        modalSelectedEmployees = [];
        msModalTeam.renderTrigger();
        msModalTeam.renderDropdown();
        msModalEmployee.renderTrigger();
        msModalEmployee.renderDropdown();
    }

    // ========== 视图层 ==========
    let currentView = "week";
    let currentBaseDate = new Date(2025, 4, 26);

    function getStartOfWeek(date) {
        const d = new Date(date);
        const day = d.getDay();
        d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
        return d;
    }

    function getViewDays(view, baseDate) {
        if(view === "week") {
            const startWeek = getStartOfWeek(baseDate);
            const days = [];
            for(let i=0; i<7; i++) {
                let day = new Date(startWeek);
                day.setDate(startWeek.getDate() + i);
                days.push({date: formatDate(day), dayOfWeek: day.getDay()});
            }
            return days;
        } else {
            const year = baseDate.getFullYear();
            const month = baseDate.getMonth();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const days = [];
            for(let d=1; d<=totalDays; d++) {
                const day = new Date(year, month, d);
                days.push({date: formatDate(day), dayOfWeek: day.getDay()});
            }
            return days;
        }
    }

    function renderTableView(baseDate) {
        const filtered = getFilteredEmployees();
        const days = getViewDays(currentView, baseDate);
        if(filtered.length === 0) {
            return `<div style="padding:40px; text-align:center; color:#94a3b8;">暂无可显示的排班数据</div>`;
        }
        return `
            <table class="schedule-table">
                <thead>
                    <tr>
                        <th style="min-width:90px;" rowspan="2">员工</th>
                        <th style="min-width:90px;" rowspan="2">团队</th>
                        ${days.map(d => `<th>${d.date}</th>`).join('')}
                    </tr>
                    <tr class="weekday-row">
                        ${days.map(d => `<th>周${weekDayNames[d.dayOfWeek]}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${filtered.map(emp => `
                        <tr>
                            <td style="background:#fafcff;"><div class="emp-info"><span class="emp-name">${emp.name}</span></div></td>
                            <td style="background:#fafcff;"><div class="emp-info"><span class="emp-team">${emp.team}</span></div></td>
                            ${days.map(d => {
                                let shiftVal = getShift(d.date, emp.name);
                                let cls = getShiftClass(shiftVal);
                                return `<td><span class="shift-tag ${cls}">${shiftVal}</span></td>`;
                            }).join('')}
                        </tr>
                    `).join('')}
                </tbody>
            </table>`;
    }

    function renderCurrentView() {
        const container = document.getElementById("scheduleViewContainer");
        container.innerHTML = renderTableView(currentBaseDate);
        if(currentView === "week") {
            let start = getStartOfWeek(currentBaseDate);
            let end = new Date(start);
            end.setDate(start.getDate() + 6);
            document.getElementById("dateRangeLabel").innerHTML = `${formatDate(start)} ~ ${formatDate(end)}`;
        } else {
            document.getElementById("dateRangeLabel").innerHTML = `${currentBaseDate.getFullYear()}年${currentBaseDate.getMonth()+1}月`;
        }
    }

    function openEditModal() {
        const today = formatDate(new Date());
        document.getElementById("modalStartDate").value = today;
        document.getElementById("modalEndDate").value = today;
        buildModalShiftRadios();
        resetModalSelections();
        document.getElementById("editModal").classList.add("active");
    }

    function closeEditModal() {
        document.getElementById("editModal").classList.remove("active");
    }

    function buildModalShiftRadios() {
        const container = document.getElementById("modalShiftRadios");
        const colorMap = {};
        workShifts.forEach(s => { colorMap[s] = "work"; });
        colorMap["休息"] = "rest";
        colorMap["请假"] = "leave";
        container.innerHTML = shiftOptions.map((s, i) =>
            `<div class="radio-option">
                <input type="radio" name="modalShift" value="${s}" id="ms_${s}" ${i===0?"checked":""}>
                <label for="ms_${s}" class="${colorMap[s]||'work'}">${s}</label>
            </div>`
        ).join('');
    }

    function saveModalEdit() {
        if(modalSelectedEmployees.length === 0) { showToast("请选择至少一名员工"); return; }
        const startDate = document.getElementById("modalStartDate").value;
        const endDate = document.getElementById("modalEndDate").value;
        const shiftRadio = document.querySelector('input[name="modalShift"]:checked');
        if(!startDate || !endDate) { showToast("请选择日期区间"); return; }
        if(startDate > endDate) { showToast("起始日期不能晚于结束日期"); return; }
        const shift = shiftRadio ? shiftRadio.value : "A班";

        let cur = parseDate(startDate);
        const end = parseDate(endDate);
        let totalCount = 0;
        while(cur <= end) {
            const dStr = formatDate(cur);
            modalSelectedEmployees.forEach(emp => {
                setShift(dStr, emp, shift);
                totalCount++;
            });
            cur.setDate(cur.getDate() + 1);
        }
        renderCurrentView();
        showToast(`已为 ${modalSelectedEmployees.length} 名员工更新 ${totalCount} 条排班记录为 ${shift}`);
        closeEditModal();
    }

    function openAddModal() {
        document.getElementById("addModal").classList.add("active");
    }

    function closeAddModal() {
        document.getElementById("addModal").classList.remove("active");
    }

    function showToast(msg) {
        const toast = document.getElementById("toastMsg");
        toast.innerText = msg;
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    function resetFilter() {
        filterSelectedEmployees = getEmployeeNames();
        filterSelectedTeams = [...getTeamOptions()];
        msPageEmployee.renderTrigger();
        msPageEmployee.renderDropdown();
        msPageTeam.renderTrigger();
        msPageTeam.renderDropdown();
        showToast("筛选条件已重置");
    }

    function prevPeriod() {
        if(currentView === "week") currentBaseDate.setDate(currentBaseDate.getDate() - 7);
        else currentBaseDate.setMonth(currentBaseDate.getMonth() - 1);
        renderCurrentView();
    }

    function nextPeriod() {
        if(currentView === "week") currentBaseDate.setDate(currentBaseDate.getDate() + 7);
        else currentBaseDate.setMonth(currentBaseDate.getMonth() + 1);
        renderCurrentView();
    }

    function init() {
        initDemoData();
        initAllMultiSelects();
        renderCurrentView();

        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.getAttribute('data-view');
                renderCurrentView();
            });
        });
        document.getElementById("prevPeriodBtn").addEventListener("click", prevPeriod);
        document.getElementById("nextPeriodBtn").addEventListener("click", nextPeriod);

        document.getElementById("resetFilterBtn").addEventListener("click", resetFilter);
        document.getElementById("queryBtn").addEventListener("click", () => {
            renderCurrentView();
            showToast("筛选完成");
        });
        document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);

        document.getElementById("editScheduleBtn").addEventListener("click", openEditModal);
        document.getElementById("addScheduleBtn").addEventListener("click", openAddModal);

        document.getElementById("selectFileBtn").addEventListener("click", () => {
            document.getElementById("uploadExcelInput").click();
        });
        document.getElementById("downloadTemplateBtn").addEventListener("click", downloadTemplate);
        document.getElementById("addModal").addEventListener("click", (e) => {
            if(e.target === document.getElementById("addModal")) closeAddModal();
        });
        document.getElementById("uploadExcelInput").addEventListener("change", (e) => {
            if(e.target.files.length) {
                importExcel(e.target.files[0]);
                closeAddModal();
            }
            e.target.value = "";
        });

        document.getElementById("modalCancelBtn").addEventListener("click", closeEditModal);
        document.getElementById("modalSaveBtn").addEventListener("click", saveModalEdit);
        document.getElementById("editModal").addEventListener("click", (e) => {
            if(e.target === document.getElementById("editModal")) closeEditModal();
        });

        document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const page = item.getAttribute('data-page');
                if(page === 'schedule') {
                    document.querySelectorAll('.sidebar-nav .nav-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                } else if(page === 'employees') {
                    window.location.href = '员工管理.html';
                } else if(page === 'shifts') {
                    window.location.href = '班次设置.html';
                } else {
                    showToast('该页面尚未开通，敬请期待');
                }
            });
        });
    }
    init();
</script>
