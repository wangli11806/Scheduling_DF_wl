<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>客服排班系统 - 员工管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
        body {
            background: #f1f5f9; margin: 0; padding: 0;
            display: flex; min-height: 100vh;
            font-size: 13px; color: #1e293b;
        }

        /* ===== 左侧菜单栏 ===== */
        .sidebar {
            width: 190px; min-width: 190px; background: #1e293b; color: #e2e8f0;
            display: flex; flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.08);
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
        }
        .sidebar-logo {
            padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 1.15rem; font-weight: 700; color: white; letter-spacing: 0.5px;
        }
        .sidebar-nav { padding: 8px 0; flex: 1; }
        .sidebar-nav .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 13px 18px; margin: 3px 10px; border-radius: 10px;
            font-size: 1rem; cursor: pointer; transition: all 0.15s;
            color: #cbd5e1; text-decoration: none; user-select: none;
        }
        .sidebar-nav .nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
        .sidebar-nav .nav-item.active {
            background: rgba(99, 102, 241, 0.25); color: #a5b4fc; font-weight: 600;
        }

        /* ===== 主内容区 ===== */
        .main-area {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
        }
        .header-bar {
            background: white; padding: 14px 28px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border-bottom: 1px solid #e8ecf1;
        }
        .header-bar h1 {
            font-size: 1.15rem; font-weight: 700; color: #1e293b; margin: 0; white-space: nowrap;
        }
        .content-body { flex: 1; padding: 20px 28px; overflow-x: hidden; }

        /* 筛选区域 */
        .filter-area {
            background: white; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px;
            display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03); border: 1px solid #e8ecf1;
        }
        .filter-field { display: flex; flex-direction: column; gap: 5px; width: 280px; }
        .filter-field label { font-size: 0.92rem; font-weight: 600; color: #64748b; }
        .filter-field input, .filter-field select {
            padding: 8px 12px; border-radius: 10px; border: 1px solid #cbd5e1;
            font-size: 0.92rem; background: white;
        }

        /* 多选下拉 */
        .multi-select { position: relative; user-select: none; }
        .multi-select-trigger {
            display: block;
            height: 34px; padding: 0 10px; border: 1px solid #cbd5e1;
            border-radius: 10px; background: white; cursor: pointer; font-size: 0.92rem;
            transition: border-color 0.15s;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            line-height: 32px;
        }
        .multi-select-trigger:hover { border-color: #94a3b8; }
        .multi-select.open .multi-select-trigger { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.12); }
        .ms-placeholder { color: #94a3b8; font-size: 0.92rem; }
        .ms-dropdown {
            display: none; position: fixed; z-index: 999;
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-height: 280px;
            overflow: hidden;
        }
        .multi-select.open .ms-dropdown { display: block; }
        .ms-search { padding: 6px 10px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 6px; align-items: center; }
        .ms-search input {
            flex: 1; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px;
            font-size: 0.92rem; outline: none;
        }
        .ms-search input:focus { border-color: #6366f1; }
        .ms-select-all {
            font-size: 0.85rem; color: #6366f1; cursor: pointer; white-space: nowrap;
            padding: 5px 10px; border-radius: 6px; font-weight: 600;
            border: 1px solid #c7d2fe; background: #eef2ff;
        }
        .ms-select-all:hover { background: #e0e7ff; }
        .ms-options { max-height: 180px; overflow-y: auto; padding: 4px 0; }
        .ms-option {
            display: flex; align-items: center; gap: 8px; padding: 7px 12px;
            font-size: 0.92rem; cursor: pointer; transition: background 0.1s;
        }
        .ms-option:hover { background: #f8fafc; }
        .ms-option input[type="checkbox"] { accent-color: #6366f1; }
        .ms-actions {
            display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid #e2e8f0;
            justify-content: flex-end;
        }
        .filter-buttons { display: flex; gap: 10px; align-items: flex-end; margin-left: auto; }
        .filter-buttons .btn { min-width: 100px; justify-content: center; }

        /* 状态Tab切换 */
        .status-tabs {
            display: flex; gap: 0; border-radius: 10px; overflow: hidden;
            border: 1px solid #cbd5e1; width: fit-content;
        }
        .status-tab {
            padding: 8px 18px; font-size: 0.92rem; cursor: pointer;
            background: white; color: #64748b; border: none; outline: none;
            transition: all 0.15s; font-weight: 500;
        }
        .status-tab + .status-tab { border-left: 1px solid #cbd5e1; }
        .status-tab.active {
            background: #2c3e66; color: white; font-weight: 600;
        }
        .status-tab:hover:not(.active) { background: #f1f5f9; }

        /* 操作栏 */
        .action-bar {
            display: flex; gap: 12px; margin-bottom: 16px; align-items: center;
        }
        .action-bar .info-text { font-size: 0.85rem; color: #94a3b8; }

        /* 按钮 */
        .btn {
            background: white; border: 1px solid #cbd5e1; padding: 7px 18px;
            border-radius: 40px; font-weight: 500; font-size: 0.92rem; cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
            color: #1e293b; white-space: nowrap;
        }
        .btn:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-primary { background: #2c3e66; border-color: #2c3e66; color: white; }
        .btn-primary:hover { background: #1e2f4a; }
        .btn-success { background: #10b981; border-color: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; border-color: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 5px 12px; font-size: 0.85rem; }

        /* 开关 */
        .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: #cbd5e1; border-radius: 22px; transition: 0.2s;
        }
        .toggle-slider::before {
            content: ""; position: absolute; height: 16px; width: 16px;
            left: 3px; bottom: 3px; background: white;
            border-radius: 50%; transition: 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #10b981; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }
        .toggle-label { font-size: 0.85rem; color: #475569; vertical-align: middle; margin-left: 6px; }

        /* 表格 */
        .table-wrapper {
            overflow-x: auto; border-radius: 16px; background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid #edf2f7;
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 900px; }
        .data-table th {
            background: #f9fbfd; padding: 12px 10px; border-bottom: 1px solid #e2e8f0;
            font-weight: 700; color: #2c3e66; text-align: left; white-space: nowrap;
        }
        .data-table td {
            border-bottom: 1px solid #f1f5f9; padding: 11px 10px;
            vertical-align: middle; color: #334155;
        }
        .data-table tbody tr:hover { background: #fafcff; }
        .data-table .actions-cell { display: flex; gap: 8px; }
        .empty-row td { text-align: center; padding: 40px; color: #94a3b8; }

        .team-badge {
            display: inline-block; padding: 3px 10px; border-radius: 6px;
            font-size: 0.85rem; font-weight: 500; background: #eef2ff; color: #3730a3;
        }
        .pos-badge {
            display: inline-block; padding: 3px 10px; border-radius: 6px;
            font-size: 0.85rem; font-weight: 500;
        }
        .pos-badge.agent { background: #dbeafe; color: #1e40af; }
        .pos-badge.manager { background: #fef3c7; color: #92400e; }

        /* 弹窗 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.45); z-index: 900;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-dialog {
            background: white; border-radius: 24px; padding: 32px; width: 480px; max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-title { font-size: 1.15rem; font-weight: 600; color: #1e293b; margin-bottom: 24px; }
        .modal-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .modal-row label { font-size: 0.92rem; font-weight: 500; color: #475569; }
        .modal-row input, .modal-row select {
            padding: 10px 14px; border-radius: 16px; border: 1px solid #cbd5e1;
            background: white; font-size: 0.92rem; width: 100%;
        }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .modal-row .required::after { content: " *"; color: #ef4444; }

        .toast-msg {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 10px 24px; border-radius: 60px;
            font-size: 0.92rem; z-index: 1000; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.2s; pointer-events: none;
        }

        @media (max-width: 860px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%; min-width: auto; height: auto; position: relative;
                flex-direction: row; flex-wrap: wrap; padding: 10px 14px; gap: 6px; align-items: center;
            }
            .sidebar-logo { padding: 0; border-bottom: none; }
            .sidebar-nav { display: flex; padding: 0; gap: 4px; }
            .sidebar-nav .nav-item { margin: 0; padding: 8px 12px; }
            .header-bar { flex-direction: column; align-items: flex-start; }
            .content-body { padding: 14px 12px; }
            .filter-field { width: 100%; }
            .filter-buttons { margin-left: 0; }
            .modal-dialog { width: 96vw; padding: 24px; }
        }
    </style>
</head>
<body>

<!-- 左侧菜单栏 -->
<aside class="sidebar">
    <div class="sidebar-logo">客服排班系统</div>
    <nav class="sidebar-nav">
        <a class="nav-item" data-page="overview" href="总览.html">总览</a>
        <a class="nav-item" data-page="schedule" href="排班表.html">排班表</a>
        <a class="nav-item" data-page="work" href="工作安排.html">工作安排</a>
        <a class="nav-item" data-page="leave" href="调休管理.html">调休管理</a>
        <a class="nav-item active" data-page="employees">员工管理</a>

</aside>

<!-- 主内容区 -->
<div class="main-area">

    <div class="header-bar">
        <h1>员工管理</h1>
    </div>

    <div class="content-body">

        <!-- 筛选区域 -->
        <div class="filter-area">
            <div class="filter-field">
                <label>员工姓名</label>
                <input type="text" id="filterName" placeholder="输入姓名搜索...">
            </div>
            <div class="filter-field">
                <label>所属团队</label>
                <select id="filterTeam">
                    <option value="">全部团队</option>
                </select>
            </div>
            <div class="filter-field">
                <label>员工岗位</label>
                <div class="multi-select" id="filterPosition">
                    <div class="multi-select-trigger" id="filterPositionTrigger">
                        <span class="ms-placeholder">全部岗位</span>
                    </div>
                    <div class="ms-dropdown">
                        <div class="ms-search">
                            <input type="text" placeholder="搜索..." id="filterPositionSearch">
                            <span class="ms-select-all" id="filterPositionAll">全选</span>
                        </div>
                        <div class="ms-options" id="filterPositionOptions"></div>
                        <div class="ms-actions">
                            <button class="btn btn-sm" id="filterPositionClear">清除</button>
                            <button class="btn btn-sm btn-primary" id="filterPositionOk">确定</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="filter-field" style="width:auto;">
                <label>员工状态</label>
                <div class="status-tabs" id="filterStatusTabs">
                    <button class="status-tab active" data-value="">全部</button>
                    <button class="status-tab" data-value="active">有效</button>
                    <button class="status-tab" data-value="inactive">无效</button>
                </div>
            </div>
            <div class="filter-buttons">
                <button class="btn" id="resetFilterBtn">重置选项</button>
                <button class="btn btn-primary" id="queryBtn">查询</button>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
            <button class="btn btn-primary" id="addEmployeeBtn">新增员工</button>
            <button class="btn" id="importEmployeeBtn">批量导入</button>
        </div>
        <!-- 数据表格 -->
        <div class="table-wrapper">
            <table class="data-table">

                    <tr>

                        <th>东福工号</th>
                        <th>姓名</th>
                        <th>团队</th>
                        <th>岗位</th>
                        <th>上级</th>
                        <th>入职日期</th>
                        <th style="text-align:center;">状态</th>
                        <th style="text-align:center; min-width:120px;">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div style="text-align:right; margin-top:8px;">
            <span class="info-text" id="tableInfo">共 0 名员工</span>
        </div>
    </div>
</div>

<!-- 新增/编辑员工弹窗 -->
<div class="modal-overlay" id="employeeModal">

        <div class="modal-title" id="modalTitle">新增员工</div>

<!-- 删除确认弹窗 -->

    <div class="modal-dialog" style="text-align:center;">
        <div class="modal-title">确认删除</div>

            <button class="btn btn-outline" id="deleteCancelBtn">取消</button>

<!-- 批量导入弹窗 -->

    </div>
</div>

<input type="file" id="uploadEmpExcelInput" accept=".xlsx" style="display:none;">

<div id="toastMsg" class="toast-msg" style="display: none;"></div>

<script>
    // ========== 数据层（后端 API） ==========
    const API_BASE = '/api';
    const teamOptions = ["在线组", "热线组", "售后组", "综合组", "VIP组", "质检组", "支持组"];
    const positionOptions = ["客服", "主管", "其他"];

    async function apiGet(url) {
        const res = await fetch(API_BASE + url);
        if (!res.ok) { const e = await res.json(); throw new Error(e.error || '请求失败'); }
        return res.json();
    }
    async function apiPost(url, data) {
        const res = await fetch(API_BASE + url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
        if (!res.ok) { const e = await res.json(); throw new Error(e.error || '操作失败'); }
        return res.json();
    }
    async function apiPut(url, data) {
        const res = await fetch(API_BASE + url, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
        if (!res.ok) { const e = await res.json(); throw new Error(e.error || '操作失败'); }
        return res.json();
    }
    async function apiDelete(url) {
        const res = await fetch(API_BASE + url, { method:'DELETE' });
        if (!res.ok) { const e = await res.json(); throw new Error(e.error || '操作失败'); }
        return res.json();
    }

    let employees = [];
    let filterName = '';
    let filterTeam = '';
    let filterStatus = '';
    let filterPositions = [];

    function getFilteredEmployees() {
        return employees.filter(e => {
            const matchName = !filterName || e.name.toLowerCase().includes(filterName.toLowerCase());
            const matchTeam = !filterTeam || e.team === filterTeam;
            const matchStatus = !filterStatus || e.status === filterStatus;
            const matchPosition = filterPositions.length === 0 || filterPositions.includes(e.position);
            return matchName && matchTeam && matchStatus && matchPosition;
        });
    }

    function getEmployeeNames() { return employees.map(e => e.name); }

    async function loadEmployees() {
        employees = await apiGet('/employees');
    }

    // ========== 渲染 ==========
    function renderTeamFilter() {
        const sel = document.getElementById("filterTeam");
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">全部团队</option>' +
            teamOptions.map(t => `<option value="${t}" ${filterTeam===t?'selected':''}>${t}</option>`).join('');
        if(currentVal) sel.value = currentVal;
    }

    function renderSupervisorOptions(excludeName) {
        const sel = document.getElementById("modalSupervisor");
        const names = getEmployeeNames().filter(n => n !== excludeName);
        sel.innerHTML = '<option value="">无</option>' +
            names.map(n => `<option value="${n}">${n}</option>`).join('');
    }

    function renderTable() {
        const filtered = getFilteredEmployees();
        const tbody = document.getElementById("tableBody");
        document.getElementById("tableInfo").textContent = `共 ${filtered.length} 名员工`;

        if(filtered.length === 0) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="9">暂无匹配的员工数据</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(e => `
            <tr>
                <td style="font-weight:500; color:#6366f1;">${e.id}</td>
                <td>${e.dongfu_id || '<span style="color:#94a3b8;">-</span>'}</td>
                <td style="font-weight:600;">${e.name}</td>
                <td><span class="team-badge">${e.team}</span></td>
                <td><span class="pos-badge ${e.position==='客服'?'agent':'manager'}">${e.position}</span></td>
                <td>${e.supervisor || '<span style="color:#94a3b8;">-</span>'}</td>
                <td>${e.entry_date || '<span style="color:#94a3b8;">-</span>'}</td>
                <td style="text-align:center;">
                    <label class="toggle-switch">
                        <input type="checkbox" ${e.status!=='inactive'?'checked':''} onchange="toggleStatus('${e.id}', this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </td>
                <td class="actions-cell" style="justify-content:center;">
                    <button class="btn btn-sm btn-outline edit-btn" data-id="${e.id}">编辑</button>
                    <button class="btn btn-sm btn-danger delete-btn" data-id="${e.id}">删除</button>
                </td>
            </tr>
        `).join('');

        tbody.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => openEditModal(btn.getAttribute('data-id')));
        });
        tbody.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => openDeleteModal(btn.getAttribute('data-id')));
        });
    }

    function refreshAll() {
        renderTeamFilter();
        renderTable();
    }

    // ========== 弹窗逻辑 ==========
    let editingEmpId = null;

    function openAddModal() {
        editingEmpId = null;
        document.getElementById("modalTitle").textContent = "新增员工";
        document.getElementById("modalName").value = '';
        document.getElementById("modalDongfuId").value = '';
        document.getElementById("modalTeam").value = '';
        document.getElementById("modalPosition").value = '';
        document.getElementById("modalEntryDate").value = '';
        document.getElementById("modalStatus").checked = true;
        document.getElementById("modalStatusLabel").textContent = '正常';
        renderSupervisorOptions(null);
        document.getElementById("employeeModal").classList.add("active");
    }

    function openEditModal(empId) {
        const emp = employees.find(e => e.id === empId);
        if(!emp) return;
        editingEmpId = empId;
        document.getElementById("modalTitle").textContent = "编辑员工";
        document.getElementById("modalName").value = emp.name;
        document.getElementById("modalDongfuId").value = emp.dongfu_id || '';
        document.getElementById("modalTeam").value = emp.team;
        document.getElementById("modalPosition").value = emp.position;
        document.getElementById("modalEntryDate").value = emp.entry_date || '';
        document.getElementById("modalStatus").checked = emp.status !== 'inactive';
        document.getElementById("modalStatusLabel").textContent = emp.status === 'inactive' ? '失效' : '正常';
        renderSupervisorOptions(emp.name);
        document.getElementById("modalSupervisor").value = emp.supervisor || '';
        document.getElementById("employeeModal").classList.add("active");
    }

    function closeEmployeeModal() {
        document.getElementById("employeeModal").classList.remove("active");
    }

    async function saveEmployee() {
        const name = document.getElementById("modalName").value.trim();
        const dongfuId = document.getElementById("modalDongfuId").value.trim();
        const team = document.getElementById("modalTeam").value;
        const position = document.getElementById("modalPosition").value;
        const supervisor = document.getElementById("modalSupervisor").value;
        const entryDate = document.getElementById("modalEntryDate").value;
        const status = document.getElementById("modalStatus").checked ? 'active' : 'inactive';

        if(!name) { showToast("请输入员工姓名"); return; }
        if(!team) { showToast("请选择所属团队"); return; }
        if(!position) { showToast("请选择岗位"); return; }
        try {
            if(editingEmpId) {
                await apiPut('/employees/' + editingEmpId, { name, dongfuId, team, position, supervisor, entryDate, status });
                showToast("员工信息已更新");
            } else {
                await apiPost('/employees', { name, dongfuId, team, position, supervisor, entryDate, status });
                showToast("员工已创建");
            }
            closeEmployeeModal();
            await loadEmployees();
            refreshAll();
        } catch(e) {
            showToast(e.message);
        }
    }

    // 删除
    let deleteTargetId = null;

    function openDeleteModal(empId) {
        deleteTargetId = empId;
        const emp = employees.find(e => e.id === empId);
        document.getElementById("deleteEmpName").textContent = emp ? emp.name : '';
        document.getElementById("deleteModal").classList.add("active");
    }

    function closeDeleteModal() {
        document.getElementById("deleteModal").classList.remove("active");
        deleteTargetId = null;
    }

    async function confirmDelete() {
        if(!deleteTargetId) return;
        const emp = employees.find(e => e.id === deleteTargetId);
        if(emp) {
            const subordinates = employees.filter(e => e.supervisor === emp.name);
            if(subordinates.length > 0) {
                showToast(`无法删除：${subordinates.map(s=>s.name).join('、')} 的上级为 ${emp.name}，请先调整`);
                closeDeleteModal();
                return;
            }
        }
        try {
            await apiDelete('/employees/' + deleteTargetId);
            await loadEmployees();
            closeDeleteModal();
            refreshAll();
            showToast("员工已删除");
        } catch(e) {
            showToast(e.message);
        }
    }

    function showToast(msg) {
        const toast = document.getElementById("toastMsg");
        toast.innerText = msg;
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    async function toggleStatus(empId, checked) {
        const status = checked ? 'active' : 'inactive';
        try {
            await apiPut('/employees/' + empId, { status });
            const emp = employees.find(e => e.id === empId);
            if (emp) emp.status = status;
        } catch(e) {
            showToast(e.message);
            renderTable();
        }
    }

    // ========== 多选下拉组件 ==========
    let msPagePosition;

    function initMultiSelect(config) {
        const { containerId, triggerId, searchId, selectAllId, optionsId, clearId, okId, getOptions, getSelected, setSelected, placeholder } = config;
        const container = document.getElementById(containerId);
        const trigger = document.getElementById(triggerId);
        const searchInput = document.getElementById(searchId);
        const selectAllBtn = document.getElementById(selectAllId);
        const optionsContainer = document.getElementById(optionsId);

        function renderTrigger() {
            const sel = getSelected();
            const allOpts = getOptions();
            if (sel.length === 0) {
                trigger.innerHTML = `<span class="ms-placeholder">${placeholder || '请选择'}</span>`;
            } else if (sel.length === allOpts.length && allOpts.length > 0) {
                trigger.innerHTML = `<span class="ms-placeholder" style="color:#3730a3;font-weight:500;">全部 (${allOpts.length})</span>`;
            } else {
                trigger.textContent = sel.join('、');
                trigger.title = sel.join('、');
            }
        }

        function renderDropdown() {
            const sel = getSelected();
            const q = searchInput.value.toLowerCase();
            const allOpts = getOptions();
            const opts = allOpts.filter(o => o.toLowerCase().includes(q));
            if (sel.length === allOpts.length && allOpts.length > 0) {
                selectAllBtn.textContent = '取消全选';
            } else {
                selectAllBtn.textContent = '全选';
            }
            optionsContainer.innerHTML = opts.map(o => {
                const checked = sel.includes(o) ? 'checked' : '';
                return `<label class="ms-option"><input type="checkbox" value="${o}" ${checked}> ${o}</label>`;
            }).join('');
            if (opts.length === 0) {
                optionsContainer.innerHTML = `<div style="padding:16px;text-align:center;color:#94a3b8;">无匹配选项</div>`;
            }
            optionsContainer.querySelectorAll('input').forEach(cb => {
                cb.addEventListener('change', () => {
                    if (cb.checked) setSelected([...getSelected(), cb.value]);
                    else setSelected(getSelected().filter(v => v !== cb.value));
                    renderTrigger();
                    if (config.onChange) config.onChange();
                });
            });
        }

        const dropdown = container.querySelector('.ms-dropdown');

        function positionDropdown() {
            const rect = trigger.getBoundingClientRect();
            const dropdownH = dropdown.scrollHeight || 280;
            const spaceBelow = window.innerHeight - rect.bottom;
            const spaceAbove = rect.top;
            if (spaceBelow < dropdownH && spaceAbove > spaceBelow) {
                dropdown.style.top = Math.max(0, rect.top - Math.min(dropdownH, 280) - 4) + 'px';
            } else {
                dropdown.style.top = Math.min(rect.bottom + 4, window.innerHeight - Math.min(dropdownH, 280)) + 'px';
            }
            dropdown.style.left = Math.min(rect.left, window.innerWidth - 260) + 'px';
            dropdown.style.width = Math.max(rect.width, 200) + 'px';
        }

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = container.classList.contains('open');
            document.querySelectorAll('.multi-select.open').forEach(ms => ms.classList.remove('open'));
            if (!isOpen) {
                container.classList.add('open');
                searchInput.value = '';
                renderDropdown();
                positionDropdown();
                setTimeout(() => searchInput.focus(), 50);
            }
        });

        searchInput.addEventListener('input', renderDropdown);
        searchInput.addEventListener('click', e => e.stopPropagation());

        selectAllBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const allOpts = getOptions();
            if (getSelected().length === allOpts.length && allOpts.length > 0) {
                setSelected([]);
            } else {
                setSelected([...allOpts]);
            }
            renderTrigger();
            renderDropdown();
            if (config.onChange) config.onChange();
        });

        document.getElementById(clearId).addEventListener('click', () => {
            setSelected([]);
            renderTrigger();
            renderDropdown();
            if (config.onChange) config.onChange();
        });

        document.getElementById(okId).addEventListener('click', () => {
            container.classList.remove('open');
        });

        document.addEventListener('click', () => {
            container.classList.remove('open');
        });

        renderTrigger();
        return { renderTrigger, renderDropdown };
    }

    // ========== 初始化 ==========
    async function init() {
        await loadEmployees();
        refreshAll();

        // 岗位多选下拉
        msPagePosition = initMultiSelect({
            containerId: 'filterPosition', triggerId: 'filterPositionTrigger',
            searchId: 'filterPositionSearch', selectAllId: 'filterPositionAll',
            optionsId: 'filterPositionOptions', clearId: 'filterPositionClear',
            okId: 'filterPositionOk', placeholder: '全部岗位',
            getOptions: () => positionOptions,
            getSelected: () => filterPositions,
            setSelected: (v) => { filterPositions = v; }
        });

        // 状态Tab切换（单选）
        document.querySelectorAll("#filterStatusTabs .status-tab").forEach(tab => {
            tab.addEventListener("click", function() {
                document.querySelectorAll("#filterStatusTabs .status-tab").forEach(t => t.classList.remove("active"));
                this.classList.add("active");
                filterStatus = this.getAttribute("data-value");
            });
        });

        document.getElementById("addEmployeeBtn").addEventListener("click", openAddModal);

        document.getElementById("resetFilterBtn").addEventListener("click", () => {
            filterName = '';
            filterTeam = '';
            filterStatus = '';
            filterPositions = [];
            document.getElementById("filterName").value = '';
            document.getElementById("filterTeam").value = '';
            document.querySelectorAll("#filterStatusTabs .status-tab").forEach(tab => {
                tab.classList.toggle("active", tab.getAttribute("data-value") === "");
            });
            msPagePosition.renderTrigger();
            refreshAll();
            showToast("筛选条件已重置");
        });

        document.getElementById("queryBtn").addEventListener("click", () => {
            filterName = document.getElementById("filterName").value.trim();
            filterTeam = document.getElementById("filterTeam").value;
            renderTable();
            showToast("筛选完成");
        });

        document.getElementById("modalCancelBtn").addEventListener("click", closeEmployeeModal);
        document.getElementById("modalSaveBtn").addEventListener("click", saveEmployee);
        document.getElementById("modalStatus").addEventListener("change", function() {
            document.getElementById("modalStatusLabel").textContent = this.checked ? '正常' : '失效';
        });
        document.getElementById("employeeModal").addEventListener("click", (e) => {
            if(e.target === document.getElementById("employeeModal")) closeEmployeeModal();
        });

        document.getElementById("deleteCancelBtn").addEventListener("click", closeDeleteModal);
        document.getElementById("deleteConfirmBtn").addEventListener("click", confirmDelete);
        document.getElementById("deleteModal").addEventListener("click", (e) => {
            if(e.target === document.getElementById("deleteModal")) closeDeleteModal();
        });

        // 批量导入
        document.getElementById("importEmployeeBtn").addEventListener("click", () => {
            document.getElementById("importModal").classList.add("active");
        });

        document.getElementById("downloadEmpTemplateBtn").addEventListener("click", () => {
            window.open('/api/employees/template', '_blank');
        });

        document.getElementById("selectEmpFileBtn").addEventListener("click", () => {
            document.getElementById("uploadEmpExcelInput").click();
        });

        document.getElementById("uploadEmpExcelInput").addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append("file", file);
            try {
                const res = await fetch('/api/employees/import', { method: 'POST', body: formData });
                const result = await res.json();
                if (!res.ok) { showToast(result.error || '导入失败'); return; }
                let msg = `成功导入 ${result.success} 名员工`;
                if (result.errors && result.errors.length > 0) {
                    msg += `，${result.errors.length} 条失败`;
                    if (result.errors.length <= 5) {
                        msg += '：' + result.errors.join('；');
                    }
                }
                showToast(msg);
                document.getElementById("importModal").classList.remove("active");
                await loadEmployees();
                refreshAll();
            } catch (err) {
                showToast('导入失败: ' + err.message);
            }
            e.target.value = '';
        });

        document.getElementById("importModal").addEventListener("click", (e) => {
            if (e.target === document.getElementById("importModal")) {
                document.getElementById("importModal").classList.remove("active");
            }
        });

        document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const page = item.getAttribute('data-page');
                if(page === 'employees') return;
                if(page === 'overview') {
                    window.location.href = '总览.html';
                    return;
                }
                if(page === 'schedule') {
                    window.location.href = '排班表.html';
                    return;
                }
                if(page === 'shifts') {
                    window.location.href = '班次设置.html';
                    return;
                }
                if(page === 'work') {
                    window.location.href = '工作安排.html';
                    return;
                }
                if(page === 'leave') {
                    window.location.href = '调休管理.html';
                    return;
                }
                if(page === 'notify') {
                    window.location.href = '通知设置.html';
                    return;
                }
                e.preventDefault();
                showToast('该页面尚未开通，敬请期待');
            });
        });
    }
    init();
</script>
</body>
</html>
