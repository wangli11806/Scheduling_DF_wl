<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>客服排班系统 - 可视化排班管理</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
        body { background: #f1f5f9; margin: 0; padding: 24px 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header-card {
            background: white; border-radius: 28px; padding: 13px 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 16px;
        }
        h1 {
            font-size: 1.3rem; font-weight: 600;
            background: linear-gradient(135deg, #1e293b, #2d3a4f);
            background-clip: text; -webkit-background-clip: text; color: transparent;
            margin: 0; letter-spacing: -0.3px;
        }
        .sub { color: #5b6e8c; font-size: 0.78rem; margin-top: 2px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .btn {
            background: white; border: 1px solid #cbd5e1; padding: 8px 18px;
            border-radius: 40px; font-weight: 500; font-size: 0.85rem; cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
            color: #1e293b;
        }
        .btn-primary { background: #2c3e66; border-color: #2c3e66; color: white; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-primary:hover { background: #1e2f4a; transform: translateY(-1px); }
        .btn-outline { border-color: #cbd5e1; }
        .btn-outline:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-danger-outline { border-color: #fecdd3; color: #be123c; }
        .btn-danger-outline:hover { background: #fff1f2; border-color: #fda4af; }
        .btn-warning { background: #f59e0b; border-color: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .file-label { position: relative; cursor: pointer; }
        .file-label input { position: absolute; opacity: 0; width: 0; height: 0; }

        .control-panel {
            background: white; border-radius: 24px; padding: 16px 24px; margin-bottom: 24px;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            gap: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .view-toggle { display: flex; background: #eef2ff; border-radius: 60px; padding: 4px; gap: 4px; }
        .view-btn {
            border: none; background: transparent; padding: 8px 24px; border-radius: 40px;
            font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 0.85rem;
        }
        .view-btn.active { background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #1f3a64; }
        .date-nav { display: flex; align-items: center; gap: 12px; background: #f8fafc; padding: 6px 16px; border-radius: 60px; }
        .date-nav button {
            background: none; border: none; font-size: 1.3rem; cursor: pointer;
            width: 30px; height: 30px; border-radius: 30px; display: inline-flex;
            align-items: center; justify-content: center;
        }
        .week-range {
            font-weight: 600; background: white; padding: 5px 14px; border-radius: 40px;
            font-size: 0.9rem; min-width: 200px; text-align: center;
        }

        /* 排班表格 */
        .schedule-table-wrapper {
            overflow-x: auto; border-radius: 24px; background: white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.03); border: 1px solid #edf2f7;
        }
        .schedule-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 700px; }
        .schedule-table th {
            background: #f9fbfd; padding: 14px 8px; border-bottom: 1px solid #e2e8f0;
            font-weight: 600; color: #2c3e66; text-align: center;
        }
        .schedule-table td {
            border: 1px solid #ecf3fa; padding: 10px 6px; text-align: center;
            vertical-align: middle; background-color: white;
        }

        /* 班次颜色标签 */
        .shift-tag {
            display: inline-block; padding: 4px 14px; border-radius: 40px;
            font-size: 0.78rem; font-weight: 600; min-width: 48px;
        }
        .shift-tag.shift-work { background: #c8e6c9; color: #2e7d32; }
        .shift-tag.shift-rest { background: #eeeeee; color: #616161; }
        .shift-tag.shift-leave { background: #ffe0b2; color: #e65100; }
        .shift-tag.shift-none { background: #f5f5f5; color: #bdbdbd; }

        /* 员工信息列 */
        .emp-info { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .emp-name { font-weight: 600; font-size: 0.9rem; color: #1e293b; }
        .emp-team { font-weight: 600; font-size: 0.9rem; color: #1e293b; }

        /* 月视图中紧凑的员工条目 */
        .month-emp-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 4px; font-size: 0.72rem; gap: 4px;
        }
        .month-emp-name { color: #334155; white-space: nowrap; }
        .month-shift-tag {
            padding: 2px 8px; border-radius: 20px; font-size: 0.62rem; font-weight: 600;
            white-space: nowrap;
        }
        .month-shift-tag.shift-work { background: #c8e6c9; color: #2e7d32; }
        .month-shift-tag.shift-rest { background: #eeeeee; color: #616161; }
        .month-shift-tag.shift-leave { background: #ffe0b2; color: #e65100; }
        .month-shift-tag.shift-none { background: #f5f5f5; color: #bdbdbd; }

        /* 弹窗遮罩 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.45); z-index: 900;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-dialog {
            background: white; border-radius: 24px; padding: 32px; width: 440px; max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-title { font-size: 1.15rem; font-weight: 600; color: #1e293b; margin-bottom: 24px; }
        .modal-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .modal-row label { font-size: 0.8rem; font-weight: 500; color: #475569; }
        .modal-row select, .modal-row input[type="date"] {
            padding: 10px 14px; border-radius: 16px; border: 1px solid #cbd5e1;
            background: white; font-size: 0.9rem; width: 100%;
        }
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .radio-option { position: relative; }
        .radio-option input { position: absolute; opacity: 0; width: 0; height: 0; }
        .radio-option label {
            display: inline-block; padding: 8px 18px; border-radius: 40px;
            border: 1.5px solid #cbd5e1; font-size: 0.82rem; cursor: pointer;
            transition: all 0.15s; font-weight: 500; color: #475569;
        }
        .radio-option input:checked + label {
            border-color: #2c3e66; background: #eef2ff; color: #1e3a5f; font-weight: 600;
        }
        .radio-option input:checked + label.work { border-color: #2e7d32; background: #c8e6c9; color: #2e7d32; }
        .radio-option input:checked + label.rest { border-color: #757575; background: #eeeeee; color: #424242; }
        .radio-option input:checked + label.leave { border-color: #e65100; background: #ffe0b2; color: #e65100; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }

        .toast-msg {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 10px 24px; border-radius: 60px;
            font-size: 0.85rem; z-index: 1000; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.2s; pointer-events: none;
        }
        footer { text-align: center; margin-top: 36px; font-size: 0.7rem; color: #6c7a91; }
        @media (max-width: 700px) {
            .header-card { flex-direction: column; align-items: flex-start; }
            .modal-dialog { padding: 24px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <div>
            <h1>📅 客服排班系统</h1>
            <div class="sub">可视化排班 · 批量编辑 · Excel导入导出</div>
        </div>
        <div class="toolbar">
            <button class="btn btn-warning" id="editScheduleBtn">✏️ 修改排班</button>
            <button class="btn btn-primary" id="exportExcelBtn">📎 导出 Excel</button>
            <label class="btn btn-outline file-label">
                📂 上传 Excel 更新排班
                <input type="file" id="uploadExcelInput" accept=".xlsx, .xls, .csv">
            </label>
            <button class="btn btn-danger-outline" id="resetDemoBtn">⟳ 重置示例数据</button>
        </div>
    </div>

    <div class="control-panel">
        <div class="view-toggle">
            <button class="view-btn active" data-view="week">📆 周视图</button>
            <button class="view-btn" data-view="month">📅 月视图</button>
        </div>
        <div class="date-nav">
            <button id="prevPeriodBtn">◀</button>
            <div class="week-range" id="dateRangeLabel">加载中...</div>
            <button id="nextPeriodBtn">▶</button>
        </div>
        <div class="toolbar">
            <button class="btn btn-outline" id="todayBtn">今天</button>
        </div>
    </div>

    <!-- 视图容器 -->
    <div id="scheduleViewContainer" class="schedule-table-wrapper"></div>
    <footer>提示：点击"修改排班"按钮可编辑单个排班；上传Excel(列：日期,员工,班次)可批量导入</footer>
</div>

<!-- 修改排班弹窗 -->
<div class="modal-overlay" id="editModal">
    <div class="modal-dialog">
        <div class="modal-title">✏️ 修改排班</div>
        <div class="modal-row">
            <label>选择员工</label>
            <select id="modalEmployee"></select>
        </div>
        <div class="modal-row">
            <label>选择日期</label>
            <input type="date" id="modalDate">
        </div>
        <div class="modal-row">
            <label>选择班次</label>
            <div class="radio-group" id="modalShiftRadios"></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="modalCancelBtn">取消</button>
            <button class="btn btn-primary" id="modalSaveBtn">保存</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg" style="display: none;"></div>

<script>
    // ---------- 数据 ----------
    let scheduleMap = new Map();
    const teamOptions = ["在线组", "热线组", "售后组", "主管", "综合组"];
    const shiftOptions = ["A班", "B班", "C班", "休息", "请假"];
    const workShifts = ["A班", "B班", "C班"];

    // 员工列表: {name, team}
    let employees = [
        {name: "张三", team: "在线组"},
        {name: "李四", team: "热线组"},
        {name: "王芳", team: "售后组"},
        {name: "赵磊", team: "在线组"},
        {name: "陈敏", team: "主管"}
    ];

    function getEmployeeNames() { return employees.map(e => e.name); }
    function getEmployeeByName(name) { return employees.find(e => e.name === name); }

    // 获取班次CSS类
    function getShiftClass(shift) {
        if (workShifts.includes(shift)) return "shift-work";
        if (shift === "休息") return "shift-rest";
        if (shift === "请假") return "shift-leave";
        return "shift-none";
    }

    function getShortShift(shift) {
        if (shift === "A班") return "A";
        if (shift === "B班") return "B";
        if (shift === "C班") return "C";
        if (shift === "休息") return "休";
        if (shift === "请假") return "假";
        return "-";
    }

    // 日期工具
    function formatDate(date) { return date.toISOString().slice(0,10); }
    function parseDate(str) { return new Date(str + "T00:00:00"); }

    // 初始化演示数据
    function initDemoData() {
        scheduleMap.clear();
        const startDemo = new Date(2025, 4, 19);
        const endDemo = new Date(2025, 5, 15);
        let cur = new Date(startDemo);
        const names = getEmployeeNames();
        while(cur <= endDemo) {
            const dateStr = formatDate(cur);
            names.forEach(emp => {
                const rand = Math.floor(Math.random() * shiftOptions.length);
                scheduleMap.set(`${dateStr}|${emp}`, shiftOptions[rand]);
            });
            cur.setDate(cur.getDate() + 1);
        }
        scheduleMap.set("2025-05-20|张三","A班");
        scheduleMap.set("2025-05-21|李四","休息");
        scheduleMap.set("2025-05-22|王芳","C班");
    }

    function getShift(date, emp) {
        return scheduleMap.get(`${date}|${emp}`) || "未排班";
    }

    function setShift(date, emp, shift) {
        if(!shift || shift === "未排班") shift = "休息";
        scheduleMap.set(`${date}|${emp}`, shift);
    }

    // Excel 导入
    function importExcelAndMerge(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1, defval: ""});
            if(!rows || rows.length < 2) { showToast("Excel至少包含两行数据"); return; }
            let header = rows[0];
            let dateIdx = -1, empIdx = -1, shiftIdx = -1;
            for(let i=0; i<header.length; i++) {
                let cell = String(header[i]).toLowerCase();
                if(cell.includes("日期")) dateIdx = i;
                else if(cell.includes("员工") || cell.includes("姓名")) empIdx = i;
                else if(cell.includes("班次") || cell.includes("shift")) shiftIdx = i;
            }
            if(dateIdx === -1 || empIdx === -1 || shiftIdx === -1) {
                showToast("Excel需包含【日期,员工,班次】三列"); return;
            }
            let updated = 0;
            const names = getEmployeeNames();
            for(let i=1; i<rows.length; i++) {
                let row = rows[i];
                if(!row || row.length < Math.max(dateIdx, empIdx, shiftIdx)+1) continue;
                let rawDate = row[dateIdx];
                let employee = row[empIdx] ? String(row[empIdx]).trim() : "";
                let shift = row[shiftIdx] ? String(row[shiftIdx]).trim() : "";
                if(!rawDate || !employee || !shift) continue;
                let dateObj = new Date(rawDate);
                if(isNaN(dateObj.getTime())) {
                    let parts = String(rawDate).split('-');
                    if(parts.length===3) dateObj = new Date(parts[0], parts[1]-1, parts[2]);
                    if(isNaN(dateObj.getTime())) continue;
                }
                const dateStr = formatDate(dateObj);
                if(!names.includes(employee)) {
                    employees.push({name: employee, team: "综合组"});
                    names.push(employee);
                    rebuildEmployeeSelects();
                }
                setShift(dateStr, employee, shift);
                updated++;
            }
            showToast(`成功导入并更新 ${updated} 条排班记录`);
            renderCurrentView();
        };
        reader.readAsArrayBuffer(file);
    }

    // Excel 导出
    function exportToExcel() {
        let dataRows = [["日期", "员工", "所属团队", "班次"]];
        let dateSet = new Set();
        for(let key of scheduleMap.keys()) {
            dateSet.add(key.split('|')[0]);
        }
        let sortedDates = Array.from(dateSet).sort();
        for(let date of sortedDates) {
            for(let emp of employees) {
                let shift = getShift(date, emp.name);
                dataRows.push([date, emp.name, emp.team, shift]);
            }
        }
        const ws = XLSX.utils.aoa_to_sheet(dataRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "排班表");
        XLSX.writeFile(wb, `排班数据_${formatDate(new Date())}.xlsx`);
        showToast("导出完成");
    }

    // 视图状态
    let currentView = "week";
    let currentBaseDate = new Date(2025, 4, 26);

    function getStartOfWeek(date) {
        const d = new Date(date);
        const day = d.getDay();
        d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
        return d;
    }

    // 周视图
    function renderWeekView(baseDate) {
        const startWeek = getStartOfWeek(baseDate);
        const days = [];
        for(let i=0; i<7; i++) {
            let day = new Date(startWeek);
            day.setDate(startWeek.getDate() + i);
            days.push(formatDate(day));
        }
        return `
            <table class="schedule-table">
                <thead>
                    <tr>
                        <th style="min-width:100px;">员工</th>
                        <th style="min-width:100px;">团队</th>
                        ${days.map(d => `<th>${d}<br><span style="font-weight:normal">${new Date(d).toLocaleDateString('zh-CN',{weekday:'short'})}</span></th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${employees.map(emp => `
                        <tr>
                            <td style="background:#fafcff;"><div class="emp-info"><span class="emp-name">${emp.name}</span></div></td>
                            <td style="background:#fafcff;"><div class="emp-info"><span class="emp-team">${emp.team}</span></div></td>
                            ${days.map(dateStr => {
                                let shiftVal = getShift(dateStr, emp.name);
                                let cls = getShiftClass(shiftVal);
                                return `<td><span class="shift-tag ${cls}">${shiftVal}</span></td>`;
                            }).join('')}
                        </tr>
                    `).join('')}
                </tbody>
            </table>`;
    }

    // 月视图
    function renderMonthView(baseDate) {
        const year = baseDate.getFullYear();
        const month = baseDate.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const startDate = new Date(firstDayOfMonth);
        startDate.setDate(1 - (startDate.getDay() === 0 ? 7 : startDate.getDay()));
        const weeks = [];
        let current = new Date(startDate);
        for(let w=0; w<6; w++) {
            let weekDays = [];
            for(let d=0; d<7; d++) {
                weekDays.push(formatDate(current));
                current.setDate(current.getDate() + 1);
            }
            weeks.push(weekDays);
        }
        let html = `<div style="overflow-x:auto;"><table class="schedule-table"><thead><tr><th style="min-width:80px">日期</th>`;
        for(let i=0; i<7; i++) html += `<th>${["一","二","三","四","五","六","日"][i]}</th>`;
        html += `</tr></thead><tbody>`;
        for(let week of weeks) {
            html += `<tr>`;
            for(let dateStr of week) {
                const dateObj = new Date(dateStr);
                const isCurrentMonth = dateObj.getMonth() === month;
                const bgStyle = isCurrentMonth ? '' : 'background:#f9f9fc; opacity:0.7';
                html += `<td style="vertical-align:top; ${bgStyle}"><div style="font-weight:600; font-size:0.75rem; padding-bottom:6px;">${dateStr.slice(5)}</div>`;
                for(let emp of employees) {
                    let shift = getShift(dateStr, emp.name);
                    let short = getShortShift(shift);
                    let cls = getShiftClass(shift);
                    html += `<div class="month-emp-row">
                        <span class="month-emp-name">${emp.name}</span>
                        <span class="month-shift-tag ${cls}">${short}</span>
                    </div>`;
                }
                html += `</td>`;
            }
            html += `</tr>`;
        }
        html += `</tbody></table></div>`;
        return html;
    }

    // 弹窗逻辑
    function openEditModal() {
        document.getElementById("modalDate").value = formatDate(new Date());
        buildModalShiftRadios();
        document.getElementById("editModal").classList.add("active");
    }

    function closeEditModal() {
        document.getElementById("editModal").classList.remove("active");
    }

    function buildModalShiftRadios() {
        const container = document.getElementById("modalShiftRadios");
        const colors = {A班:"work", B班:"work", C班:"work", 休息:"rest", 请假:"leave"};
        container.innerHTML = shiftOptions.map(s =>
            `<div class="radio-option">
                <input type="radio" name="modalShift" value="${s}" id="ms_${s}" ${s==="A班"?"checked":""}>
                <label for="ms_${s}" class="${colors[s]||''}">${s}</label>
            </div>`
        ).join('');
    }

    function saveModalEdit() {
        const emp = document.getElementById("modalEmployee").value;
        const date = document.getElementById("modalDate").value;
        const shiftRadio = document.querySelector('input[name="modalShift"]:checked');
        if(!emp) { showToast("请选择员工"); return; }
        if(!date) { showToast("请选择日期"); return; }
        const shift = shiftRadio ? shiftRadio.value : "A班";
        setShift(date, emp, shift);
        renderCurrentView();
        showToast(`已更新 ${emp} ${date} 班次为 ${shift}`);
        closeEditModal();
    }

    // 重建所有员工选择框
    function rebuildEmployeeSelects() {
        const sel = document.getElementById("modalEmployee");
        if(!sel) return;
        sel.innerHTML = '<option value="">-- 请选择 --</option>' +
            employees.map(e => `<option value="${e.name}">${e.name} (${e.team})</option>`).join('');
    }

    function renderCurrentView() {
        const container = document.getElementById("scheduleViewContainer");
        if(currentView === "week") {
            container.innerHTML = renderWeekView(currentBaseDate);
            let start = getStartOfWeek(currentBaseDate);
            let end = new Date(start);
            end.setDate(start.getDate() + 6);
            document.getElementById("dateRangeLabel").innerHTML = `${formatDate(start)} ~ ${formatDate(end)}`;
        } else {
            container.innerHTML = renderMonthView(currentBaseDate);
            document.getElementById("dateRangeLabel").innerHTML = `${currentBaseDate.getFullYear()}年${currentBaseDate.getMonth()+1}月`;
        }
    }

    function showToast(msg) {
        const toast = document.getElementById("toastMsg");
        toast.innerText = msg;
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    function prevPeriod() {
        if(currentView === "week") {
            currentBaseDate.setDate(currentBaseDate.getDate() - 7);
        } else {
            currentBaseDate.setMonth(currentBaseDate.getMonth() - 1);
        }
        renderCurrentView();
    }
    function nextPeriod() {
        if(currentView === "week") {
            currentBaseDate.setDate(currentBaseDate.getDate() + 7);
        } else {
            currentBaseDate.setMonth(currentBaseDate.getMonth() + 1);
        }
        renderCurrentView();
    }
    function goToday() {
        currentBaseDate = new Date();
        renderCurrentView();
    }

    function init() {
        initDemoData();
        rebuildEmployeeSelects();
        renderCurrentView();

        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.getAttribute('data-view');
                renderCurrentView();
            });
        });
        document.getElementById("prevPeriodBtn").addEventListener("click", prevPeriod);
        document.getElementById("nextPeriodBtn").addEventListener("click", nextPeriod);
        document.getElementById("todayBtn").addEventListener("click", goToday);

        document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
        document.getElementById("uploadExcelInput").addEventListener("change", (e) => {
            if(e.target.files.length) importExcelAndMerge(e.target.files[0]);
            e.target.value = "";
        });
        document.getElementById("resetDemoBtn").addEventListener("click", () => {
            initDemoData();
            renderCurrentView();
            showToast("已重置为示例排班数据");
        });

        // 修改排班弹窗
        document.getElementById("editScheduleBtn").addEventListener("click", openEditModal);
        document.getElementById("modalCancelBtn").addEventListener("click", closeEditModal);
        document.getElementById("modalSaveBtn").addEventListener("click", saveModalEdit);
        // 点击遮罩关闭
        document.getElementById("editModal").addEventListener("click", (e) => {
            if(e.target === document.getElementById("editModal")) closeEditModal();
        });
    }
    init();
</script>
</body>
</html>
