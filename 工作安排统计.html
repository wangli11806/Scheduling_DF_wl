<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>客服排班系统 - 工作安排统计</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
        body {
            background: #f1f5f9; margin: 0; padding: 0;
            display: flex; min-height: 100vh;
            font-size: 13px; color: #1e293b;
        }

        .sidebar {
            width: 190px; min-width: 190px; background: #1e293b; color: #e2e8f0;
            display: flex; flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.08);
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
        }
        .sidebar-logo {
            padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 1.15rem; font-weight: 700; color: white; letter-spacing: 0.5px;
        }
        .sidebar-nav { padding: 8px 0; flex: 1; }
        .sidebar-nav .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 13px 18px; margin: 3px 10px; border-radius: 10px;
            font-size: 1rem; cursor: pointer; transition: all 0.15s;
            color: #cbd5e1; text-decoration: none; user-select: none;
        }
        .sidebar-nav .nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
        .sidebar-nav .nav-item.active {
            background: rgba(99, 102, 241, 0.25); color: #a5b4fc; font-weight: 600;
        }

        .nav-group .nav-group-toggle { cursor: pointer; }
        .nav-group .nav-group-toggle::after {
            content: ' ▾'; font-size: 0.7rem; margin-left: auto;
        }
        .nav-group.open .nav-group-toggle::after { content: ' ▴'; }
        .nav-submenu { display: none; }
        .nav-group.open .nav-submenu { display: block; }
        .nav-sub-item { padding-left: 48px !important; font-size: 0.92rem !important; }

        .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .header-bar {
            background: white; padding: 14px 28px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #e8ecf1;
        }
        .header-bar h1 { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin: 0; }
        .content-body { flex: 1; padding: 20px 28px; overflow-y: auto; }

        .filter-bar {
            display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
            background: white; border-radius: 12px; padding: 14px 20px; margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03); border: 1px solid #e8ecf1;
        }
        .filter-field { display: flex; flex-direction: column; gap: 5px; }
        .filter-field label { font-size: 0.85rem; font-weight: 600; color: #64748b; }

        .month-selector {
            display: flex; align-items: center; gap: 10px;
        }
        .month-selector .month-label {
            font-size: 1.05rem; font-weight: 700; color: #1e293b; min-width: 110px; text-align: center;
        }
        .month-btn {
            background: none; border: 1px solid #e2e8f0; cursor: pointer;
            font-size: 0.95rem; color: #475569; padding: 4px 10px; border-radius: 6px;
            transition: all 0.15s;
        }
        .month-btn:hover { background: #f1f5f9; color: #1e293b; border-color: #cbd5e1; }

        .multi-select { position: relative; user-select: none; }
        .multi-select-trigger {
            height: 34px; padding: 0 10px; border: 1px solid #cbd5e1;
            border-radius: 10px; background: white; cursor: pointer; font-size: 0.92rem;
            transition: border-color 0.15s; overflow: hidden; white-space: nowrap;
            text-overflow: ellipsis; line-height: 32px; width: 280px;
        }
        .multi-select-trigger:hover { border-color: #94a3b8; }
        .multi-select.open .multi-select-trigger { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.12); }
        .ms-placeholder { color: #94a3b8; font-size: 0.92rem; }
        .ms-dropdown {
            display: none; position: fixed; z-index: 999;
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-height: 280px;
            overflow: hidden;
        }
        .multi-select.open .ms-dropdown { display: block; }
        .ms-select-all { font-size: 0.85rem; color: #6366f1; cursor: pointer; white-space: nowrap; padding: 5px 10px; border-radius: 6px; font-weight: 600; border: 1px solid #c7d2fe; background: #eef2ff; }
        .ms-select-all:hover { background: #e0e7ff; }
        .ms-options { max-height: 180px; overflow-y: auto; padding: 4px 0; }
        .ms-option { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 0.92rem; cursor: pointer; transition: background 0.1s; }
        .ms-option:hover { background: #f8fafc; }
        .ms-option input[type="checkbox"] { accent-color: #6366f1; }
        .ms-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
        .ms-actions { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid #e2e8f0; justify-content: flex-end; }

        .btn {
            background: white; border: 1px solid #cbd5e1; padding: 6px 14px;
            border-radius: 40px; font-weight: 500; font-size: 0.85rem; cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
            color: #1e293b; white-space: nowrap;
        }
        .btn:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-primary { background: #2c3e66; border-color: #2c3e66; color: white; }
        .btn-primary:hover { background: #1e2f4a; }

        .table-wrapper {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03); border: 1px solid #e8ecf1;
        }
        table {
            width: 100%; border-collapse: collapse; font-size: 0.88rem;
        }
        table th, table td {
            padding: 10px 14px; text-align: center; vertical-align: middle;
            border: 1px solid #ecf3fa;
        }
        table thead th {
            position: sticky; top: 0; z-index: 10;
            background: #f9fbfd; padding: 12px 14px;
            font-weight: 700; color: #2c3e66; font-size: 0.85rem;
        }
        table tbody tr:hover td { background: #eef2ff; }

        .col-name { width: 120px; }
        .col-work { width: 100px; }

        .count-cell { font-weight: 600; font-size: 1rem; }
        .count-zero { color: #cbd5e1; }

        .toast-msg {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 10px 24px; border-radius: 60px;
            font-size: 0.92rem; z-index: 1000; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.2s; pointer-events: none;
        }

        @media (max-width: 860px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; min-width: auto; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; padding: 10px 14px; gap: 6px; align-items: center; }
            .sidebar-logo { padding: 0; border-bottom: none; }
            .sidebar-nav { display: flex; padding: 0; gap: 4px; }
            .sidebar-nav .nav-item { margin: 0; padding: 8px 12px; }
            .content-body { padding: 14px 12px; }
            .filter-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">客服排班系统</div>
    <nav class="sidebar-nav">
        <a class="nav-item" data-page="overview" href="总览.html">总览</a>
        <div class="nav-group">
            <div class="nav-item nav-group-toggle" data-page="schedule-group">排班表</div>
            <div class="nav-submenu">
                <a class="nav-item nav-sub-item" data-page="schedule" href="排班表.html">排班表</a>
                <a class="nav-item nav-sub-item" data-page="raw-schedule" href="原始排班.html">原始排班</a>
            </div>
        </div>
        <a class="nav-item" data-page="work" href="工作安排.html">工作安排</a>
        <a class="nav-item" data-page="leave" href="排班调整.html">排班调整</a>
        <a class="nav-item" data-page="employees" href="员工管理.html">员工管理</a>
        <a class="nav-item" data-page="shifts" href="班次设置.html">班次设置</a>
        <a class="nav-item" data-page="notify" href="通知设置.html">通知设置</a>
        <div class="nav-group open">
            <div class="nav-item nav-group-toggle" data-page="stats">排班统计</div>
            <div class="nav-submenu">
                <a class="nav-item nav-sub-item" data-page="monthly-hours" href="月度时长统计.html">月度时长统计</a>
                <a class="nav-item nav-sub-item active" data-page="assignment-stats" href="工作安排统计.html">工作安排统计</a>
            </div>
        </div>
    </nav>
</aside>

<div class="main-area">
    <div class="header-bar">
        <h1>工作安排统计</h1>
        <button class="btn btn-primary" id="exportBtn" style="padding:7px 20px;">导出Excel</button>
    </div>
    <div class="content-body">
        <div class="filter-bar">
            <div class="filter-field">
                <label>月份</label>
                <div class="month-selector">
                    <button class="month-btn" id="prevMonthBtn" title="上个月">◀</button>
                    <span class="month-label" id="monthLabel"></span>
                    <button class="month-btn" id="nextMonthBtn" title="下个月">▶</button>
                </div>
            </div>
            <div class="filter-field">
                <label>所属团队</label>
                <div class="multi-select" id="filterTeam">
                    <div class="multi-select-trigger" id="filterTeamTrigger">
                        <span class="ms-placeholder">售后组</span>
                    </div>
                    <div class="ms-dropdown">
                        <div class="ms-header">
                            <span class="ms-select-all" id="filterTeamAll">全选</span>
                        </div>
                        <div class="ms-options" id="filterTeamOptions"></div>
                        <div class="ms-actions">
                            <button class="btn" id="filterTeamClear">清除</button>
                            <button class="btn btn-primary" id="filterTeamOk">确定</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-name">员工姓名</th>
                        <th class="col-work">反向工单</th>
                        <th class="col-work">自主售后</th>
                        <th class="col-work">售后单</th>
                        <th class="col-work">紧急</th>
                        <th class="col-work">本地生活</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg" style="display:none;"></div>

<script>
const API_BASE = '/api';
const WORK_TYPES = ["反向工单", "自主售后", "售后单", "紧急", "本地生活"];

async function apiGet(url) {
    const res = await fetch(API_BASE + url);
    if (!res.ok) { const e = await res.json(); throw new Error(e.error || '请求失败'); }
    return res.json();
}

function showToast(msg) {
    const t = document.getElementById("toastMsg");
    t.innerText = msg; t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 2500);
}

let currentYear, currentMonth;
let filterTeams = [];
let teamOptions = [];

function formatMonthLabel(y, m) {
    return y + '年' + m + '月';
}

function buildApiUrl() {
    let url = `/assignment-stats?year=${currentYear}&month=${currentMonth}`;
    if (filterTeams.length > 0 && filterTeams.length < teamOptions.length) {
        url += `&team=${encodeURIComponent(filterTeams.join(','))}`;
    } else if (filterTeams.length === 1) {
        url += `&team=${encodeURIComponent(filterTeams[0])}`;
    }
    return url;
}

async function loadData() {
    try {
        const resp = await apiGet(buildApiUrl());
        const data = resp.rows;
        const tbody = document.getElementById("tableBody");

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="padding:48px 24px;text-align:center;color:#94a3b8;">暂无数据</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(row => `
            <tr>
                <td style="font-weight:600;">${escapeHtml(row.name)}</td>
                ${WORK_TYPES.map(w => {
                    const cnt = row[w] || 0;
                    const cls = cnt === 0 ? 'count-zero' : '';
                    return `<td class="count-cell ${cls}">${cnt}</td>`;
                }).join('')}
            </tr>
        `).join('');
    } catch(e) {
        showToast('数据加载失败: ' + e.message);
    }
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function initMultiSelect(config) {
    const { containerId, triggerId, selectAllId, optionsId, clearId, okId, getOptions, getSelected, setSelected, placeholder, onChange } = config;
    const container = document.getElementById(containerId);
    const trigger = document.getElementById(triggerId);
    const selectAllBtn = document.getElementById(selectAllId);
    const optionsContainer = document.getElementById(optionsId);

    function renderTrigger() {
        const sel = getSelected();
        const allOpts = getOptions();
        if (sel.length === 0) {
            trigger.innerHTML = `<span class="ms-placeholder">${placeholder || '请选择'}</span>`;
        } else if (sel.length === allOpts.length && allOpts.length > 0) {
            trigger.innerHTML = `<span class="ms-placeholder" style="color:#3730a3;font-weight:500;">全部 (${allOpts.length})</span>`;
        } else {
            trigger.textContent = sel.join('、');
            trigger.title = sel.join('、');
        }
    }

    function renderDropdown() {
        const sel = getSelected();
        const allOpts = getOptions();
        selectAllBtn.textContent = (sel.length === allOpts.length && allOpts.length > 0) ? '取消全选' : '全选';
        optionsContainer.innerHTML = allOpts.map(o => {
            const checked = sel.includes(o) ? 'checked' : '';
            return `<label class="ms-option"><input type="checkbox" value="${o}" ${checked}> ${o}</label>`;
        }).join('');
        optionsContainer.querySelectorAll('input').forEach(cb => {
            cb.addEventListener('change', () => {
                if (cb.checked) setSelected([...getSelected(), cb.value]);
                else setSelected(getSelected().filter(v => v !== cb.value));
                renderTrigger();
                if (onChange) onChange();
            });
        });
    }

    const dropdown = container.querySelector('.ms-dropdown');

    function positionDropdown() {
        const rect = trigger.getBoundingClientRect();
        const dropdownH = dropdown.scrollHeight || 280;
        const spaceBelow = window.innerHeight - rect.bottom;
        const spaceAbove = rect.top;
        if (spaceBelow < dropdownH && spaceAbove > spaceBelow) {
            dropdown.style.top = Math.max(0, rect.top - Math.min(dropdownH, 280) - 4) + 'px';
        } else {
            dropdown.style.top = Math.min(rect.bottom + 4, window.innerHeight - Math.min(dropdownH, 280)) + 'px';
        }
        dropdown.style.left = Math.min(rect.left, window.innerWidth - 260) + 'px';
        dropdown.style.width = Math.max(rect.width, 200) + 'px';
    }

    trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = container.classList.contains('open');
        document.querySelectorAll('.multi-select.open').forEach(ms => ms.classList.remove('open'));
        if (!isOpen) {
            container.classList.add('open');
            renderDropdown();
            positionDropdown();
        }
    });
    selectAllBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const allOpts = getOptions();
        setSelected(getSelected().length === allOpts.length && allOpts.length > 0 ? [] : [...allOpts]);
        renderTrigger();
        renderDropdown();
        if (onChange) onChange();
    });
    document.getElementById(clearId).addEventListener('click', () => {
        setSelected([]);
        renderTrigger();
        renderDropdown();
        if (onChange) onChange();
    });
    document.getElementById(okId).addEventListener('click', () => { container.classList.remove('open'); });
    document.addEventListener('click', () => { container.classList.remove('open'); });
    renderTrigger();
    return { renderTrigger, renderDropdown };
}

async function init() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth() + 1;

    document.getElementById("monthLabel").textContent = formatMonthLabel(currentYear, currentMonth);

    // 获取团队列表，默认选中售后组
    try {
        const resp = await apiGet(`/assignment-stats?year=${currentYear}&month=${currentMonth}`);
        teamOptions = resp.teams || [];
        // 默认选中售后组
        if (teamOptions.includes('售后组')) {
            filterTeams = ['售后组'];
        } else {
            filterTeams = [...teamOptions];
        }
    } catch(e) {
        showToast('加载团队列表失败: ' + e.message);
        filterTeams = ['售后组'];
    }

    initMultiSelect({
        containerId: 'filterTeam', triggerId: 'filterTeamTrigger',
        selectAllId: 'filterTeamAll', optionsId: 'filterTeamOptions',
        clearId: 'filterTeamClear', okId: 'filterTeamOk',
        placeholder: '售后组',
        getOptions: () => teamOptions,
        getSelected: () => filterTeams,
        setSelected: (v) => { filterTeams = v; },
        onChange: () => { loadData(); }
    });

    // 月份切换
    document.getElementById("prevMonthBtn").addEventListener("click", () => {
        if (currentMonth === 1) { currentYear--; currentMonth = 12; }
        else currentMonth--;
        document.getElementById("monthLabel").textContent = formatMonthLabel(currentYear, currentMonth);
        loadData();
    });
    document.getElementById("nextMonthBtn").addEventListener("click", () => {
        if (currentMonth === 12) { currentYear++; currentMonth = 1; }
        else currentMonth++;
        document.getElementById("monthLabel").textContent = formatMonthLabel(currentYear, currentMonth);
        loadData();
    });

    // 导出按钮
    document.getElementById("exportBtn").addEventListener("click", () => {
        let url = API_BASE + `/assignment-stats/export?year=${currentYear}&month=${currentMonth}`;
        if (filterTeams.length === 1) {
            url += `&team=${encodeURIComponent(filterTeams[0])}`;
        } else if (filterTeams.length > 1) {
            url += `&team=${encodeURIComponent(filterTeams.join(','))}`;
        }
        window.open(url, '_blank');
    });

    // 侧边栏导航
    document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
            const page = item.getAttribute('data-page');
            if (page === 'stats' || page === 'schedule-group') {
                e.preventDefault();
                item.closest('.nav-group').classList.toggle('open');
                return;
            }
            const pageMap = {
                overview: '总览.html',
                'raw-schedule': '原始排班.html',
                schedule: '排班表.html',
                employees: '员工管理.html',
                shifts: '班次设置.html',
                work: '工作安排.html',
                leave: '排班调整.html',
                notify: '通知设置.html',
                'monthly-hours': '月度时长统计.html',
                'assignment-stats': '工作安排统计.html'
            };
            if (pageMap[page]) {
                window.location.href = pageMap[page];
            } else {
                e.preventDefault();
                showToast('该页面尚未开通，敬请期待');
            }
        });
    });

    loadData();
}
init();
</script>
</body>
</html>
